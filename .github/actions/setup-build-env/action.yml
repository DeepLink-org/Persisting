name: "Setup Build Environment"
description: "Python, Rust, uv, just, and optional legacy protoc for Persisting CI"
inputs:
  python-version:
    description: "Python version"
    required: false
    default: "3.12"
  rust-toolchain:
    description: "Rust toolchain"
    required: false
    default: "stable"
  install-protoc:
    description: "Install the legacy native protobuf compiler when explicitly required"
    required: false
    default: "false"
  components:
    description: "Rust components (comma-separated)"
    required: false
    # rust-src keeps the opt-in `just sanitize` (-Z build-std) path usable in
    # CI without changing the normal build commands.
    default: "rustfmt, clippy, rust-src"
  install-dioxus:
    description: "Install the pinned Dioxus CLI and wasm target"
    required: false
    default: "false"
  install-nextest:
    description: "Install cargo-nextest"
    required: false
    default: "true"
  install-zig:
    description: "Install Zig for the macOS-to-Linux guest init cross-build"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.rust-toolchain }}
        components: ${{ inputs.components }}

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    - name: Install just
      uses: taiki-e/install-action@v2
      with:
        tool: just@1.57.0

    - name: Install cargo-nextest
      if: inputs.install-nextest == 'true'
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest@0.9.137

    - name: Install Linux guest init cross-compiler
      if: runner.os == 'macOS' && inputs.install-zig == 'true'
      shell: bash
      run: |
        brew install zig
        zig version

    - name: Add Dioxus Web target
      if: inputs.install-dioxus == 'true'
      shell: bash
      run: rustup target add wasm32-unknown-unknown

    - name: Install Dioxus CLI
      if: inputs.install-dioxus == 'true'
      uses: taiki-e/install-action@v2
      with:
        tool: dioxus-cli@0.7.9

    - name: Verify Dioxus CLI
      if: inputs.install-dioxus == 'true'
      shell: bash
      run: dx --version

    - name: Install protoc
      if: inputs.install-protoc == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends \
          protobuf-compiler \
          libprotobuf-dev
        protoc --version
        test -f /usr/include/google/protobuf/empty.proto

    - name: Install protoc
      if: inputs.install-protoc == 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        brew install protobuf
        protoc --version
