name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-nextest: "false"
          components: "rustfmt"

      - name: Rust formatting
        run: just fmt-check-rust

  rust-clippy:
    name: Clippy / pChronicle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-nextest: "false"
          components: "clippy"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-clippy-pchronicle

      - name: pChronicle and CLI Clippy
        run: just clippy-deny

      - name: pChronicle storage feature contracts
        run: just clippy-pchronicle-features

  rust-clippy-pchronicle-web:
    name: Clippy / pChronicle Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-nextest: "false"
          components: "clippy"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-clippy-pchronicle-web
          workspaces: pchronicle-web -> target

      - name: pChronicle Web Clippy
        run: just clippy-pchronicle-web

  rust-test:
    name: Rust Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          components: ""

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust-pchronicle

      - name: Run pChronicle and CLI tests
        run: just test pchronicle

      - name: Smoke pChronicle CLI
        run: just smoke-pchronicle-cli

  rust-proptest:
    name: Rust Proptest / pChronicle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          components: ""

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust-proptest-pchronicle

      # Keep property tests out of the regular pChronicle package shard so
      # nextest can schedule the two workloads on separate runners.
      - name: Run pChronicle property-test regression
        run: just proptest pchronicle

  pchronicle-web-test:
    name: pChronicle Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-dioxus: "true"
          components: ""

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-pchronicle-web
          workspaces: pchronicle-web -> target

      - name: Build Web assets
        run: just chronicle-web-build

      - name: Test Web crate
        run: just test-pchronicle-web

  s3-contract:
    name: pChronicle S3 Contract / MinIO
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MINIO_VERSION: RELEASE.2025-07-23T15-54-02Z
      MC_VERSION: RELEASE.2025-08-13T08-35-41Z
      MINIO_GO_VERSION: "1.24.2"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          components: ""

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-pchronicle-s3

      - name: Cache pinned MinIO tools
        id: minio-tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/minio-bin
          key: minio-v1-${{ runner.os }}-${{ runner.arch }}-go${{ env.MINIO_GO_VERSION }}-${{ env.MINIO_VERSION }}-${{ env.MC_VERSION }}

      - uses: actions/setup-go@v5
        if: steps.minio-tools.outputs.cache-hit != 'true'
        with:
          go-version: ${{ env.MINIO_GO_VERSION }}
          cache: false

      # Upstream no longer distributes the public container images or binaries.
      - name: Build pinned MinIO tools from source
        if: steps.minio-tools.outputs.cache-hit != 'true'
        env:
          GOBIN: ${{ runner.temp }}/minio-bin
        run: |
          go install "github.com/minio/minio@$MINIO_VERSION"
          go install "github.com/minio/mc@$MC_VERSION"

      - name: Add MinIO tools to PATH
        run: echo "$RUNNER_TEMP/minio-bin" >> "$GITHUB_PATH"

      - name: Start pinned MinIO server
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin123
        run: |
          nohup minio server "$RUNNER_TEMP/minio-data" --address 127.0.0.1:9000 \
            > "$RUNNER_TEMP/minio.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/minio.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/minio.log"
          exit 1

      - name: Create isolated test bucket
        run: |
          mc alias set local http://127.0.0.1:9000 minioadmin minioadmin123
          mc mb --ignore-existing local/persisting-tests

      - name: Run real S3 storage contract
        env:
          PCHRONICLE_S3_TEST_URI: s3://persisting-tests/contracts
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin123
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT: http://127.0.0.1:9000
          AWS_ALLOW_HTTP: "true"
          AWS_VIRTUAL_HOSTED_STYLE_REQUEST: "false"
        run: just test-pchronicle-s3

      - name: Show MinIO logs after failure
        if: failure()
        run: test ! -f "$RUNNER_TEMP/minio.log" || cat "$RUNNER_TEMP/minio.log"

      - name: Stop MinIO
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/minio.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/minio.pid")" || true
          fi

  python:
    name: Python Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-rust: "false"
          install-nextest: "false"
          components: ""

      - name: Sync Python deps
        run: just py-dev

      - name: Ruff
        run: just lint-py

      - name: Pytest
        run: just test-py

  examples:
    name: Examples / pchronicle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-nextest: "false"
          components: ""

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-examples-pchronicle

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Run pChronicle examples
        env:
          WORK_ROOT: ${{ runner.temp }}/pchronicle-examples
        run: just examples-pchronicle

  ci:
    name: CI
    if: always()
    needs:
      - format
      - rust-clippy
      - rust-clippy-pchronicle-web
      - rust-test
      - rust-proptest
      - pchronicle-web-test
      - s3-contract
      - python
      - examples
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI shard to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in ${RESULTS}; do
            if [[ "${result}" != "success" ]]; then
              echo "A required CI job finished with: ${result}" >&2
              exit 1
            fi
          done
