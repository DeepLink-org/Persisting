name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-protoc: "false"

      - uses: Swatinem/rust-cache@v2

      - name: Rust formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path pchronicle-web/Cargo.toml -- --check

      - name: Rust clippy
        # Match local `just clippy` for now; tighten to `-D warnings` once the
        # workspace is clean (same bar as Pulsing).
        run: cargo clippy --workspace --all-targets --locked

      - name: Python lint (ruff)
        run: uvx ruff check persisting/

  rust-test:
    name: Rust Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-protoc: "false"
          install-dioxus: "true"

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          python3 scripts/packaging/stage_wheel_binaries.py --web-only
          cargo build --workspace --all-targets --locked

      - name: Test pChronicle Web
        run: cargo test --manifest-path pchronicle-web/Cargo.toml --locked

      - name: Build Agent CLI component set
        run: |
          cargo build -p persisting-pchronicle-cli --bin pchronicle --locked
          just pvisor debug
          cargo build -p persisting-ppilot --bin ppilot --locked

      - name: Test
        # GitHub-hosted Linux runners may disable unprivileged user namespaces.
        # The rootless integration tests only skip permission-denied failures
        # from that exact namespace setup boundary; other failures remain fatal.
        env:
          PERSISTING_TEST_ALLOW_NO_USERNS: "1"
        run: cargo test --workspace --locked

      - name: Test shared event control contract
        if: runner.os == 'Linux'
        # pVisor no longer links a Chronicle storage backend. Exercise the
        # lightweight sidecar/control feature at its owning crate boundary.
        run: cargo test -p persisting-events --features control --locked

      - name: Smoke product CLIs
        run: |
          just smoke-pvisor-cli
          ./target/debug/ppilot run --help
          ./target/debug/ppilot produce --help
          ./target/debug/pchronicle query --help

  pvisor-isolation-regression:
    name: pVisor Isolation Regression (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-protoc: "false"
          components: ""

      - uses: Swatinem/rust-cache@v2

      - name: Enable rootless isolation primitives
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fuse3 jq util-linux
          if sysctl kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          test -c /dev/fuse
          unshare --user --map-root-user --mount --net /bin/true

      - name: Run strict pVisor isolation regressions
        env:
          PERSISTING_RUN_HOME: ${{ runner.temp }}/pvisor-isolation-runs
        run: just test-pvisor-isolation

      - name: Run pVisor filesystem examples
        env:
          WORK_ROOT: ${{ runner.temp }}/pvisor-filesystem-examples
        run: just examples-pvisor-filesystem

  s3-contract:
    name: pChronicle S3 Contract (MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env

      - uses: Swatinem/rust-cache@v2

      - name: Start pinned MinIO server
        run: |
          docker run --detach --name persisting-minio-contract \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin123 \
            quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z \
            server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs persisting-minio-contract
          exit 1

      - name: Create isolated test bucket
        run: |
          docker run --rm --network host --entrypoint /bin/sh \
            quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z -c \
            'mc alias set local http://127.0.0.1:9000 minioadmin minioadmin123 && mc mb --ignore-existing local/persisting-tests'

      - name: Run real S3 storage contract
        env:
          PCHRONICLE_S3_TEST_URI: s3://persisting-tests/contracts
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin123
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT: http://127.0.0.1:9000
          AWS_ALLOW_HTTP: "true"
          AWS_VIRTUAL_HOSTED_STYLE_REQUEST: "false"
        run: cargo test -p persisting-pchronicle --test s3_storage --locked -- --ignored

      - name: Show MinIO logs after failure
        if: failure()
        run: docker logs persisting-minio-contract

      - name: Stop MinIO
        if: always()
        run: docker rm --force persisting-minio-contract || true

  python-test:
    name: Python Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: "3.12"
          install-protoc: "false"
          install-dioxus: "true"

      - uses: Swatinem/rust-cache@v2

      - name: Sync Python deps
        run: uv sync --extra all --extra dev

      - name: Pytest
        run: uv run pytest tests/ -q

  examples:
    name: Agent Infra Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env

      - uses: Swatinem/rust-cache@v2

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Validate pVisor benchmark contract
        run: just test-pvisor-benchmark

      - name: Run portable pVisor examples
        env:
          WORK_ROOT: ${{ runner.temp }}/pvisor-portable-examples
        run: just examples-pvisor-portable

      # pPilot/pChronicle retain their existing loops until those components
      # receive the same `just`-first standardization as pVisor.
      - name: Run pPilot examples
        run: |
          cargo build --release -q \
            -p persisting-pchronicle-cli --bin pchronicle \
            -p persisting-ppilot --bin ppilot
          cargo build --release -q \
            -p persisting-pvisor --bin pvisor
          for example in examples/ppilot/*; do
            [ -f "$example/run.sh" ] || continue
            echo "==> ${example}/run.sh"
            (cd "$example" && bash run.sh)
          done

      - name: Run pChronicle examples
        run: |
          cargo build --release -q -p persisting-pchronicle-cli --bin pchronicle
          for example in examples/pchronicle/*; do
            [ -f "$example/run.sh" ] || continue
            echo "==> ${example}/run.sh"
            (cd "$example" && bash run.sh)
          done
