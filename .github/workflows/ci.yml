name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-protoc: "false"
          install-nextest: "false"
          install-zig: "false"
          components: "rustfmt"

      - name: Rust formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path pchronicle-web/Cargo.toml -- --check

  rust-clippy-workspace:
    name: Clippy / Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-protoc: "false"
          install-nextest: "false"
          install-zig: "false"
          components: "clippy"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-clippy-workspace

      - name: Workspace Clippy
        run: just clippy-deny

  rust-clippy-pchronicle:
    name: Clippy / pChronicle Feature Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-protoc: "false"
          install-nextest: "false"
          install-zig: "false"
          components: "clippy"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-clippy-pchronicle

      - name: Strict pChronicle Clippy
        run: just clippy-pchronicle-panics

      - name: pChronicle storage feature contracts
        run: just clippy-pchronicle-features

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Ruff
        run: uvx ruff check persisting/

  rust-test:
    name: Rust Test / ${{ matrix.platform }} / ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            shard: core
            packages: >-
              -p persisting-agentctl
              -p persisting-events
              -p persisting-overlay-core
              -p persisting-overlayfs
              -p persisting-overlaynet
              -p persisting-replay
            event_control: true
            prepare_pvisor: false
            prepare_runtime: false
            smoke_pvisor: false
            smoke_ppilot: false
            smoke_pchronicle: false
            install_zig: false
          - platform: Linux
            os: ubuntu-latest
            shard: gateway
            packages: -p persisting-gateway
            event_control: false
            prepare_pvisor: false
            prepare_runtime: false
            smoke_pvisor: false
            smoke_ppilot: false
            smoke_pchronicle: false
            install_zig: false
          - platform: Linux
            os: ubuntu-latest
            shard: pvisor
            packages: -p persisting-pvisor
            event_control: false
            prepare_pvisor: true
            prepare_runtime: false
            smoke_pvisor: true
            smoke_ppilot: false
            smoke_pchronicle: false
            install_zig: false
          - platform: Linux
            os: ubuntu-latest
            shard: ppilot
            packages: -p persisting-ppilot
            event_control: false
            prepare_pvisor: false
            prepare_runtime: true
            smoke_pvisor: false
            smoke_ppilot: true
            smoke_pchronicle: false
            install_zig: false
          - platform: Linux
            os: ubuntu-latest
            shard: pchronicle
            packages: >-
              -p persisting-pchronicle
              -p persisting-pchronicle-cli
            event_control: false
            prepare_pvisor: false
            prepare_runtime: false
            smoke_pvisor: false
            smoke_ppilot: false
            smoke_pchronicle: true
            install_zig: false
          - platform: macOS
            os: macos-latest
            shard: agent-runtime
            packages: >-
              -p persisting-agentctl
              -p persisting-events
              -p persisting-gateway
              -p persisting-overlay-core
              -p persisting-overlayfs
              -p persisting-overlaynet
              -p persisting-ppilot
              -p persisting-pvisor
              -p persisting-replay
            event_control: false
            prepare_pvisor: false
            prepare_runtime: true
            smoke_pvisor: true
            smoke_ppilot: true
            smoke_pchronicle: false
            install_zig: true
          - platform: macOS
            os: macos-latest
            shard: pchronicle
            packages: >-
              -p persisting-pchronicle
              -p persisting-pchronicle-cli
            event_control: false
            prepare_pvisor: false
            prepare_runtime: false
            smoke_pvisor: false
            smoke_ppilot: false
            smoke_pchronicle: true
            install_zig: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-protoc: "false"
          install-zig: "${{ matrix.install_zig }}"
          components: ""

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust-${{ matrix.shard }}

      # macOS needs the Hypervisor entitlement on the product binary. Running
      # the same recipe on Linux also keeps the smoke-test setup identical.
      - name: Build pVisor product binary
        if: matrix.prepare_pvisor
        run: just pvisor debug

      # pPilot's integration tests resolve the real pVisor and pChronicle
      # executables from PATH. Build them once in this shard before nextest.
      - name: Build Agent runtime component set
        if: matrix.prepare_runtime
        run: |
          just pvisor debug
          cargo build --locked \
            -p persisting-pchronicle-cli --bin pchronicle \
            -p persisting-ppilot --bin ppilot
          echo "${GITHUB_WORKSPACE}/target/debug" >> "${GITHUB_PATH}"

      - name: Run ${{ matrix.shard }} tests
        env:
          # GitHub-hosted Linux runners may disable unprivileged user
          # namespaces. The dedicated isolation job remains strict.
          PERSISTING_TEST_ALLOW_NO_USERNS: "1"
          RUST_MIN_STACK: "8388608"
        run: cargo nextest run --locked ${{ matrix.packages }}

      - name: Test shared event control contract
        if: matrix.event_control
        run: cargo nextest run -p persisting-events --features control --locked

      - name: Build pChronicle CLI
        if: matrix.smoke_pchronicle
        run: cargo build -p persisting-pchronicle-cli --bin pchronicle --locked

      - name: Smoke pVisor CLI
        if: matrix.smoke_pvisor
        run: just smoke-pvisor-cli

      - name: Smoke pPilot CLI
        if: matrix.smoke_ppilot
        run: |
          ./target/debug/ppilot run --help
          ./target/debug/ppilot produce --help

      - name: Smoke pChronicle CLI
        if: matrix.smoke_pchronicle
        run: ./target/debug/pchronicle query --help

  rust-proptest:
    name: Rust Proptest / pChronicle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-zig: "false"
          components: ""

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust-proptest-pchronicle

      # Keep property tests out of the regular pChronicle package shard so
      # nextest can schedule the two workloads on separate runners.
      - name: Run pChronicle property-test regression
        env:
          RUST_MIN_STACK: "8388608"
        run: just proptest pchronicle

  pchronicle-web-test:
    name: pChronicle Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-protoc: "false"
          install-dioxus: "true"
          install-zig: "false"
          components: ""

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-pchronicle-web
          workspaces: pchronicle-web -> target

      - name: Build Web assets
        run: python3 scripts/packaging/stage_wheel_binaries.py --web-only

      - name: Test Web crate
        run: cargo nextest run --manifest-path pchronicle-web/Cargo.toml --locked

  pvisor-isolation-regression:
    name: pVisor Isolation Regression / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-protoc: "false"
          install-zig: "false"
          components: ""

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-pvisor-isolation

      - name: Enable rootless isolation primitives
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fuse3 jq util-linux
          if sysctl kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          test -c /dev/fuse
          unshare --user --map-root-user --mount --net /bin/true

      - name: Run strict pVisor isolation regressions
        env:
          PERSISTING_RUN_HOME: ${{ runner.temp }}/pvisor-isolation-runs
        run: just test-pvisor-isolation

      - name: Run pVisor filesystem examples
        env:
          WORK_ROOT: ${{ runner.temp }}/pvisor-filesystem-examples
        run: just examples-pvisor-filesystem

  s3-contract:
    name: pChronicle S3 Contract / MinIO
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-zig: "false"
          components: ""

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-pchronicle-s3

      - name: Start pinned MinIO server
        run: |
          docker run --detach --name persisting-minio-contract \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin123 \
            quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z \
            server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs persisting-minio-contract
          exit 1

      - name: Create isolated test bucket
        run: |
          docker run --rm --network host --entrypoint /bin/sh \
            quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z -c \
            'mc alias set local http://127.0.0.1:9000 minioadmin minioadmin123 && mc mb --ignore-existing local/persisting-tests'

      - name: Run real S3 storage contract
        env:
          PCHRONICLE_S3_TEST_URI: s3://persisting-tests/contracts
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin123
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT: http://127.0.0.1:9000
          AWS_ALLOW_HTTP: "true"
          AWS_VIRTUAL_HOSTED_STYLE_REQUEST: "false"
        run: cargo nextest run -p persisting-pchronicle --test s3_storage --locked --run-ignored all

      - name: Show MinIO logs after failure
        if: failure()
        run: docker logs persisting-minio-contract

      - name: Stop MinIO
        if: always()
        run: docker rm --force persisting-minio-contract || true

  python-test:
    name: Python Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync Python deps
        run: uv sync --extra all --extra dev

      - name: Pytest
        run: uv run pytest tests/ -q

  examples:
    name: Examples / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: pvisor
            command: |
              just test-pvisor-benchmark
              just examples-pvisor-portable
          - shard: ppilot
            command: just examples-ppilot
          - shard: pchronicle
            command: just examples-pchronicle
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-protoc: "false"
          install-nextest: "false"
          install-zig: "false"
          components: ""

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-examples-${{ matrix.shard }}

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Run ${{ matrix.shard }} examples
        env:
          WORK_ROOT: ${{ runner.temp }}/${{ matrix.shard }}-examples
        run: ${{ matrix.command }}

  ci:
    name: CI
    if: always()
    needs:
      - format
      - rust-clippy-workspace
      - rust-clippy-pchronicle
      - python-lint
      - rust-test
      - rust-proptest
      - pchronicle-web-test
      - pvisor-isolation-regression
      - s3-contract
      - python-test
      - examples
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI shard to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in ${RESULTS}; do
            if [[ "${result}" != "success" ]]; then
              echo "A required CI job finished with: ${result}" >&2
              exit 1
            fi
          done
