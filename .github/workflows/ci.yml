name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-protoc: "true"

      - uses: Swatinem/rust-cache@v2

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust clippy
        # Match local `just clippy` for now; tighten to `-D warnings` once the
        # workspace is clean (same bar as Pulsing).
        run: cargo clippy --workspace --all-targets --locked

      - name: Python lint (ruff)
        run: uvx ruff check persisting/

  rust-test:
    name: Rust Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-protoc: "true"

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Build Agent CLI component set
        run: |
          cargo build -p persisting-cli --bin persisting --locked
          cargo build -p persisting-pvisor --bin pvisor --locked
          cargo build -p persisting-ppilot --features cli --bin ppilot --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Test pPilot CLI feature
        run: cargo test -p persisting-ppilot --features cli --locked

      - name: Smoke unified component dispatch
        run: |
          ./target/debug/persisting execute -- /usr/bin/true
          ./target/debug/persisting batch --help
          ./target/debug/persisting query --help

  s3-contract:
    name: pChronicle S3 Contract (MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env

      - uses: Swatinem/rust-cache@v2

      - name: Start pinned MinIO server
        run: |
          docker run --detach --name persisting-minio-contract \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin123 \
            quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z \
            server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs persisting-minio-contract
          exit 1

      - name: Create isolated test bucket
        run: |
          docker run --rm --network host --entrypoint /bin/sh \
            quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z -c \
            'mc alias set local http://127.0.0.1:9000 minioadmin minioadmin123 && mc mb --ignore-existing local/persisting-tests'

      - name: Run real S3 storage contract
        env:
          PCHRONICLE_S3_TEST_URI: s3://persisting-tests/contracts
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin123
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT: http://127.0.0.1:9000
          AWS_ALLOW_HTTP: "true"
          AWS_VIRTUAL_HOSTED_STYLE_REQUEST: "false"
        run: cargo test -p persisting-pchronicle --test s3_storage --locked -- --ignored

      - name: Show MinIO logs after failure
        if: failure()
        run: docker logs persisting-minio-contract

      - name: Stop MinIO
        if: always()
        run: docker rm --force persisting-minio-contract || true

  python-test:
    name: Python Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: "3.12"
          install-protoc: "true"

      - uses: Swatinem/rust-cache@v2

      - name: Sync Python deps
        run: uv sync --extra all --extra dev

      - name: Build extension (maturin develop)
        run: uv run maturin develop

      - name: Pytest
        run: uv run pytest tests/ -q

  examples:
    name: Agent Infra Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env

      - uses: Swatinem/rust-cache@v2

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      # The pVisor filesystem examples need macFUSE/FUSE3 and are not run here;
      # they stay covered by local `just examples-pvisor`. The quantitative
      # pPilot/pChronicle examples below compile their own binaries from source.
      - name: Run pPilot examples
        run: |
          cargo build -q -p persisting-ppilot --features cli --bin ppilot
          for example in examples/ppilot/*; do
            [ -f "$example/run.sh" ] || continue
            echo "==> ${example}/run.sh"
            (cd "$example" && bash run.sh)
          done

      - name: Run pChronicle examples
        run: |
          for example in examples/pchronicle/*; do
            [ -f "$example/run.sh" ] || continue
            echo "==> ${example}/run.sh"
            (cd "$example" && bash run.sh)
          done
