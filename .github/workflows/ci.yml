name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-nextest: "false"
          install-zig: "false"
          components: "rustfmt"

      - name: Rust formatting
        run: just fmt-check-rust

  rust-clippy-workspace:
    name: Clippy / Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-nextest: "false"
          install-zig: "false"
          components: "clippy"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-clippy-workspace

      - name: Workspace Clippy
        run: just clippy-deny

  rust-clippy-pchronicle:
    name: Clippy / pChronicle Feature Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-nextest: "false"
          install-zig: "false"
          components: "clippy"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-clippy-pchronicle

      - name: Strict pChronicle Clippy
        run: just clippy-pchronicle-panics

      - name: pChronicle storage feature contracts
        run: just clippy-pchronicle-features

  rust-clippy-pchronicle-web:
    name: Clippy / pChronicle Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-nextest: "false"
          install-zig: "false"
          components: "clippy"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-clippy-pchronicle-web
          workspaces: pchronicle-web -> target

      - name: pChronicle Web Clippy
        run: just clippy-pchronicle-web

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-nextest: "false"
          install-zig: "false"
          components: ""

      - name: Ruff
        run: just lint-py

  rust-test:
    name: Rust Test / ${{ matrix.platform }} / ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            shard: core
            packages: >-
              persisting-agentctl
              persisting-events
              persisting-overlaynet
            event_control: true
            smoke_pchronicle: false
            install_zig: false
          - platform: Linux
            os: ubuntu-latest
            shard: gateway
            packages: persisting-gateway
            event_control: false
            smoke_pchronicle: false
            install_zig: false
          - platform: Linux
            os: ubuntu-latest
            shard: pchronicle
            packages: >-
              persisting-pchronicle
              persisting-pchronicle-cli
            event_control: false
            smoke_pchronicle: true
            install_zig: false
          - platform: macOS
            os: macos-latest
            shard: capture
            packages: >-
              persisting-agentctl
              persisting-events
              persisting-gateway
              persisting-overlaynet
            event_control: false
            smoke_pchronicle: false
            install_zig: false
          - platform: macOS
            os: macos-latest
            shard: pchronicle
            packages: >-
              persisting-pchronicle
              persisting-pchronicle-cli
            event_control: false
            smoke_pchronicle: true
            install_zig: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-zig: "${{ matrix.install_zig }}"
          components: ""

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust-${{ matrix.shard }}

      - name: Run ${{ matrix.shard }} tests
        run: just ci-nextest ${{ matrix.packages }}

      - name: Test shared event control contract
        if: matrix.event_control
        run: just test-events-control

      - name: Smoke pChronicle CLI
        if: matrix.smoke_pchronicle
        run: just smoke-pchronicle-cli

  rust-proptest:
    name: Rust Proptest / pChronicle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-zig: "false"
          components: ""

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust-proptest-pchronicle

      # Keep property tests out of the regular pChronicle package shard so
      # nextest can schedule the two workloads on separate runners.
      - name: Run pChronicle property-test regression
        run: just proptest pchronicle

  pchronicle-web-test:
    name: pChronicle Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-dioxus: "true"
          install-zig: "false"
          components: ""

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-pchronicle-web
          workspaces: pchronicle-web -> target

      - name: Build and test Web crate
        run: just test-pchronicle-web

  s3-contract:
    name: pChronicle S3 Contract / MinIO
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-zig: "false"
          components: ""

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-pchronicle-s3

      - name: Start pinned MinIO server
        run: |
          docker run --detach --name persisting-minio-contract \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin123 \
            quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z \
            server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs persisting-minio-contract
          exit 1

      - name: Create isolated test bucket
        run: |
          docker run --rm --network host --entrypoint /bin/sh \
            quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z -c \
            'mc alias set local http://127.0.0.1:9000 minioadmin minioadmin123 && mc mb --ignore-existing local/persisting-tests'

      - name: Run real S3 storage contract
        env:
          PCHRONICLE_S3_TEST_URI: s3://persisting-tests/contracts
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin123
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT: http://127.0.0.1:9000
          AWS_ALLOW_HTTP: "true"
          AWS_VIRTUAL_HOSTED_STYLE_REQUEST: "false"
        run: just test-pchronicle-s3

      - name: Show MinIO logs after failure
        if: failure()
        run: docker logs persisting-minio-contract

      - name: Stop MinIO
        if: always()
        run: docker rm --force persisting-minio-contract || true

  python-test:
    name: Python Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-nextest: "false"
          install-zig: "false"
          components: ""

      - name: Sync Python deps
        run: just py-dev

      - name: Pytest
        run: just test-py

  examples:
    name: Examples / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: pchronicle
            command: just examples-pchronicle
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python for examples
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-nextest: "false"
          install-zig: "false"
          components: ""

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-examples-${{ matrix.shard }}

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Run ${{ matrix.shard }} examples
        env:
          WORK_ROOT: ${{ runner.temp }}/${{ matrix.shard }}-examples
          PYTHON_BIN: ${{ steps.setup-python.outputs.python-path }}
        run: ${{ matrix.command }}

  ci:
    name: CI
    if: always()
    needs:
      - format
      - rust-clippy-workspace
      - rust-clippy-pchronicle
      - rust-clippy-pchronicle-web
      - python-lint
      - rust-test
      - rust-proptest
      - pchronicle-web-test
      - s3-contract
      - python-test
      - examples
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI shard to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in ${RESULTS}; do
            if [[ "${result}" != "success" ]]; then
              echo "A required CI job finished with: ${result}" >&2
              exit 1
            fi
          done
