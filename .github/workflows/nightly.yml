# Nightly wheels from main — rolling GitHub Release tag `nightly`.
#
# Install (after a successful run):
#   curl -fsSL https://raw.githubusercontent.com/DeepLink-org/Persisting/main/scripts/install-nightly.sh | bash
# Or browse assets: https://github.com/DeepLink-org/Persisting/releases/tag/nightly

name: Nightly Build

on:
  schedule:
    # 03:00 UTC daily
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    if: github.repository == 'DeepLink-org/Persisting'
    runs-on: ubuntu-latest
    outputs:
      local_version: ${{ steps.ver.outputs.local_version }}
    steps:
      - id: ver
        shell: bash
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          echo "local_version=g${GITHUB_RUN_NUMBER}.${short_sha}" >> "$GITHUB_OUTPUT"

  linux:
    if: github.repository == 'DeepLink-org/Persisting'
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: "3.12"
          install-protoc: "true"
          install-dioxus: "true"

      - uses: Swatinem/rust-cache@v2

      - name: Build pChronicle Web assets
        run: python3 scripts/packaging/stage_wheel_binaries.py --web-only

      - name: Apply nightly local version (PEP 440)
        run: |
          python scripts/ci/set_nightly_local_version.py "${{ needs.meta.outputs.local_version }}"
          cargo metadata --format-version 1 >/dev/null

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: >-
            --release --locked --out dist --auditwheel repair
          before-script-linux: >-
            yum install -y glibc-static &&
            env -u RUSTC_WRAPPER PERSISTING_FETCH_LIBKRUNFW=1
            /opt/python/cp312-cp312/bin/python scripts/packaging/stage_wheel_binaries.py
            --target x86_64-unknown-linux-gnu --profile release --locked
          sccache: "true"
          manylinux: 2014
          maturin-version: v1.14.1
          rust-toolchain: stable

      - name: Verify wheel component set
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          python scripts/packaging/verify_wheel.py "$wheel" --install-smoke

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: nightly-wheels-linux-${{ matrix.target }}
          path: dist/*.whl
          retention-days: 14

  macos:
    if: github.repository == 'DeepLink-org/Persisting'
    needs: meta
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: "3.12"
          install-protoc: "true"
          install-dioxus: "true"

      - uses: Swatinem/rust-cache@v2

      - name: Install libkrunfw
        run: |
          brew tap slp/krun
          brew install libkrunfw
          echo "PERSISTING_LIBKRUNFW_PATH=$(brew --prefix libkrunfw)/lib/libkrunfw.5.dylib" >> "$GITHUB_ENV"

      - name: Build pChronicle Web assets
        run: python3 scripts/packaging/stage_wheel_binaries.py --web-only

      - name: Apply nightly local version (PEP 440)
        run: |
          python scripts/ci/set_nightly_local_version.py "${{ needs.meta.outputs.local_version }}"
          cargo metadata --format-version 1 >/dev/null

      - name: Stage wheel CLI component set
        run: >-
          python3 scripts/packaging/stage_wheel_binaries.py
          --target aarch64-apple-darwin --profile release --locked

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: >-
            --release --locked --out dist --find-interpreter
          sccache: "true"
          maturin-version: v1.14.1
          rust-toolchain: stable

      - name: Verify wheel component set
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          python scripts/packaging/verify_wheel.py "$wheel" --install-smoke

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: nightly-wheels-macos-aarch64
          path: dist/*.whl
          retention-days: 14

  publish:
    name: Publish nightly release
    if: github.repository == 'DeepLink-org/Persisting'
    needs: [meta, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-wheels-*
          merge-multiple: true
          path: dist

      - name: Publish rolling nightly release
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: Nightly (main)
          commit: ${{ github.sha }}
          allowUpdates: true
          makeLatest: false
          prerelease: true
          removeArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: dist/*.whl
          body: |
            Rolling nightly build from [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) on **${{ github.ref_name }}**.

            **Python wheel** (auto-detect platform / Python):

            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install-nightly.sh | bash
            ```

            The wheel includes the matched `persisting`, `pvisor`, and `ppilot` CLI component set. Built with local version `+${{ needs.meta.outputs.local_version }}` (base version from `pyproject.toml`).
