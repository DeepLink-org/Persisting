name: Documentation

on:
  push:
    branches: [main, master]
    paths: ['docs/**', 'scripts/*docs*.py', 'justfile', '.github/workflows/docs.yml']
  pull_request:
    branches: [main, master]
    paths: ['docs/**', 'scripts/*docs*.py', 'justfile', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Zensical site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build documentation
        working-directory: docs
        run: uv run --no-project --with zensical==0.0.61 python ../scripts/build-docs.py
      - name: Check generated pages
        run: python scripts/check-docs.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
