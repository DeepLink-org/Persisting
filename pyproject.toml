[project]
name = "persisting"
version = "0.2.0"
description = "Agent execution, orchestration, and durable history infrastructure"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "reiase"}
]
dependencies = [
    "pulsing",
    "tensordict>=0.6.0",
]

[project.urls]
Homepage = "https://deeplink-org.github.io/Persisting/"
Documentation = "https://deeplink-org.github.io/Persisting/"
Repository = "https://github.com/DeepLink-org/Persisting"
Issues = "https://github.com/DeepLink-org/Persisting/issues"

[project.optional-dependencies]
lance = [
    "lance>=0.9.0",
    "pyarrow>=14.0.0",
]
all = [
    "persisting[lance]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
include = ["persisting*"]
exclude = ["persisting.dldb*"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "build_backend"
backend-path = ["scripts/packaging"]

[tool.cibuildwheel]
build = "cp312-*"
# Nightly/PyPI only publish manylinux + macOS wheels; musllinux is unused
# and its before-all still assumes yum.
skip = "*-musllinux_*"
build-frontend = "build"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux2014"
before-all = [
    "yum install -y curl glibc-static",
    "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable",
    "/opt/python/cp312-cp312/bin/python -m pip install --no-cache-dir cargo-zigbuild==0.23.0 ziglang==0.14.1",
]
# rustc libstd on current stable references glibc 2.27/2.28 symbols
# (statx, copy_file_range). Neither rust-lld nor GNU ld on manylinux2014
# can satisfy those as weak refs. cargo-zigbuild links against a glibc 2.17
# sysroot so the wheel can keep the manylinux2014 tag.
# zig 0.14.1 avoids the zig 0.15+ libc++ / bindgen mismatch with libkrun.
environment = { PATH = "$HOME/.cargo/bin:/opt/python/cp312-cp312/bin:$PATH", PERSISTING_CARGO_ZIGBUILD = "1", CFLAGS = "-isystem /usr/include" }

[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
repair-wheel-command = "cp {wheel} {dest_dir}"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
