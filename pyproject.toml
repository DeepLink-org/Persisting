[project]
name = "persisting"
version = "0.2.0"
description = "Agent execution, orchestration, and durable history infrastructure"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "reiase"}
]
dependencies = [
    "pulsing",
    "tensordict>=0.6.0",
]

[project.optional-dependencies]
lance = [
    "lance>=0.9.0",
    "pyarrow>=14.0.0",
]
safetensors = [
    "safetensors>=0.4.0",
]
all = [
    "persisting[lance]",
    "persisting[safetensors]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "maturin>=1.14,<2.0",
]

[tool.maturin]
module-name = "persisting._core"
manifest-path = "crates/persisting-core/Cargo.toml"
python-packages = ["persisting"]
features = ["python-extension"]
data = "target/wheel-data"
profile = "release"
editable-profile = "dev"
locked = true
sdist-generator = "git"
include = [
    { path = "LICENSE", format = "sdist" },
    { path = "README.md", format = "sdist" },
    { path = "scripts/packaging/*.py", format = "sdist" },
]
# Keep the installable top-level dldb package out of the persisting wheel tree.
# Install dldb separately: pip install -e ./persisting/dldb
exclude = ["persisting/dldb/**"]

[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "build_backend"
backend-path = ["scripts/packaging"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
