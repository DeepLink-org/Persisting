[workspace]
resolver = "2"
members = [
    "crates/persisting-proto",
    "crates/persisting-access",
    "crates/persisting-engine",
    "crates/persisting-core",
    "crates/persisting-capture",
    "crates/persisting-cli",
    "crates/persisting-dlcapt",
    "crates/persisting-ppilot",
    "crates/persisting-pvisor",
    "crates/persisting-pchronicle",
    "crates/persisting-overlayfs",
]

default-members = [
    "crates/persisting-proto",
    "crates/persisting-access",
    "crates/persisting-engine",
    "crates/persisting-core",
    "crates/persisting-capture",
    "crates/persisting-cli",
    "crates/persisting-dlcapt",
    "crates/persisting-ppilot",
    "crates/persisting-pvisor",
    "crates/persisting-pchronicle",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["reiase"]
license = "GPL-3.0-or-later"
description = "Persistent Storage for Parameters, KV Cache, and Trajectories"

[profile.dev]
debug = "line-tables-only"
incremental = true
codegen-units = 256

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "z"
lto = "thin"
strip = "symbols"
codegen-units = 1

[workspace.dependencies]
pulsing-actor = { version = "0.1.2", default-features = false }

[patch.crates-io]
fuser = { path = "vendor/fuser" }
