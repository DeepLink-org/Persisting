[workspace]
resolver = "2"
members = [
    "crates/persisting-proto",
    "crates/persisting-control",
    "crates/persisting-engine",
    "crates/persisting-core",
    "crates/persisting-gateway",
    "crates/persisting-cli",
    "crates/persisting-dlcapt",
    "crates/persisting-ppilot",
    "crates/persisting-pvisor",
    "crates/persisting-pchronicle",
    "crates/persisting-overlayfs",
    "crates/persisting-overlaynet",
]

default-members = [
    "crates/persisting-proto",
    "crates/persisting-control",
    "crates/persisting-engine",
    "crates/persisting-core",
    "crates/persisting-gateway",
    "crates/persisting-cli",
    "crates/persisting-dlcapt",
    "crates/persisting-ppilot",
    "crates/persisting-pvisor",
    "crates/persisting-pchronicle",
    "crates/persisting-overlaynet",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["reiase"]
license = "Apache-2.0"
description = "Agent execution, orchestration, and durable history infrastructure"

[profile.dev]
# This workspace links several large Lance/DataFusion binaries. Keep incremental
# compilation for the normal edit/build/check loop, but omit debug information
# to limit artifact size. The test profile below disables incremental state
# because its many binaries and feature combinations otherwise dominate disk.
# Use `--profile dev-debug` when source-level debugger information is needed.
# `debug = 0` already omits debug info; `strip = "none"` avoids a redundant
# post-link copy that doubles peak disk usage for large test executables.
debug = 0
incremental = true
codegen-units = 64
strip = "none"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = 0
incremental = false
codegen-units = 64
strip = "none"

[profile.test.package."*"]
debug = false

[profile.dev-debug]
inherits = "dev"
debug = "line-tables-only"
incremental = true
codegen-units = 256
strip = "none"

[profile.release]
opt-level = "z"
lto = "thin"
strip = "symbols"
codegen-units = 1

[workspace.dependencies]
pulsing-actor = { version = "0.1.2", default-features = false }

[patch.crates-io]
fuser = { path = "vendor/fuser" }
