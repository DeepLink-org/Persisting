[package]
name = "pchronicle-web"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace]

[dependencies]
dioxus = { version = "=0.7.9", features = ["web"] }
dioxus-web = "=0.7.9"
futures-util = "0.3"
gloo-net = { version = "0.6", features = ["http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
urlencoding = "2"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "DomRect", "Element", "History", "HtmlElement", "HtmlTextAreaElement", "KeyboardEvent", "Location", "Storage", "UrlSearchParams", "Window"] }
web-time = "=1.1.0"

[features]
default = []
native-code = ["dep:dioxus-code"]

# Tree-sitter/Arborium highlighting is kept out of the browser build. The
# WASM renderer uses the dependency-free fallback in `agenticmd_view.rs`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dioxus-code = { version = "0.1.2", optional = true, default-features = false, features = [
    "runtime",
    "lang-json",
    "lang-python",
    "lang-toml",
] }

[profile.dev]
debug = 0
incremental = true

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
debug = false
