[run]
agent = "overlaynet-example"

[overlaynet]
mode = "proxy"
policy = "allowlist"

# A hostname rule resolves before the second authorization check. Private and
# loopback results require an explicit opt-in; IP/CIDR rules do not.
[[overlaynet.rules]]
host = "localhost"
ports = [19111]
transports = ["http"]
allow_private_ips = true

# Deny rules are checked before every allow/default decision and again for each
# resolved address. This protects metadata/link-local ranges even in public mode.
[[overlaynet.deny]]
host = "169.254.0.0/16"

# Every matching limit applies. The global ceiling is loose; the CIDR-specific
# ceiling is stricter and matches localhost's authorized 127.0.0.1 address.
[[overlaynet.limits]]
bytes_per_second = 1000000

[[overlaynet.limits]]
host = "127.0.0.0/8"
port = 19111
bytes_per_second = 4000
