# 多厂商透传路由 — 按客户端 model 前缀选 upstream，body/token 不变
#
# 出口控制默认 public。收紧示例：
#   [network]
#   mode = "allowlist"
#   allowed_hosts = [
#       "pypi.org",
#       "files.pythonhosted.org",
#   ]
# （各 [[models]] upstream host 在 allowlist 模式下会自动并入）
# 完整白名单模板见 allowlist.toml。

listen = "127.0.0.1:8080"
admin_listen = "127.0.0.1:9876"
agent_id = "multi"

[[models]]
name = "deepseek*"
provider = "openai"
upstream = "https://api.deepseek.com/v1"
upstream_anthropic = "https://api.deepseek.com/anthropic/v1"
api_key_env = "DEEPSEEK_API_KEY"

[[models]]
name = "claude*"
provider = "anthropic"
upstream = "https://api.anthropic.com/v1"
api_key_env = "ANTHROPIC_API_KEY"

[[models]]
name = "gemini*"
provider = "gemini"
upstream = "https://generativelanguage.googleapis.com/v1beta"
api_key_env = "GEMINI_API_KEY"

[[models]]
name = "gpt*"
provider = "openai"
upstream = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
