# Harbor 风格出口白名单 — 转发代理仅允许下列 host
#
#   export DEEPSEEK_API_KEY=sk-...
#   persisting traj capture -o ./store -c examples/llm-proxy/allowlist.toml -f md -- claude
#
# 说明：
#   - mode = "allowlist"：未列出的 CONNECT / 绝对 URI 出站返回 403
#   - [[models]] upstream host（此处 api.deepseek.com）会自动并入白名单
#   - 相对路径打到 listen 的 LLM 网关不受名单约束
#   - localhost / 127.0.0.1 / ::1 始终旁路
#
# 另见：deepseek.toml（默认 public）、multi-provider.toml

listen = "127.0.0.1:19081"
admin_listen = "127.0.0.1:9876"
agent_id = "deepseek-allowlist"

[network]
mode = "allowlist"
allowed_hosts = [
    "pypi.org",
    "files.pythonhosted.org",
    "github.com",
    "api.github.com",
    "registry.npmjs.org",
]

[[models]]
name = "deepseek-v4-flash"
provider = "openai"
upstream = "https://api.deepseek.com/v1"
upstream_anthropic = "https://api.deepseek.com/anthropic/v1"
api_key_env = "DEEPSEEK_API_KEY"

[[models]]
name = "*"
forward = "deepseek-v4-flash"
