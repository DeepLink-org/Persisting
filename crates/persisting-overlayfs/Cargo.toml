[package]
name = "persisting-overlayfs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Cross-platform FUSE overlay (macFUSE / libfuse) for pVisor staging"
readme = "README.md"

[[bin]]
name = "persisting-overlayfs"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
libc.workspace = true
log.workspace = true
env_logger.workspace = true
clap = { workspace = true, features = ["derive"] }
jj-lib.workspace = true
pollster.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
fuser = { workspace = true, features = ["abi-7-19", "libfuse", "macfuse-5"] }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { workspace = true, default-features = false, features = ["abi-7-31"] }

[target.'cfg(not(any(target_os = "macos", target_os = "linux")))'.dependencies]
fuser = { workspace = true, features = ["abi-7-19", "libfuse"] }

[dev-dependencies]
tempfile.workspace = true
