[replay]
agent = "claude-code"
trajectory = "trajectory.jsonl"
after_step = 1
workspace = "."
state_dir = "/tmp/pvisor-replay-managed-state"
output_dir = "/tmp/pvisor-replay-managed-output"
prepare_only = true
disable_thinking = false

[run]
executor = "host"
timeout_ms = 60000
policy = "observe"
inherit_env = false
