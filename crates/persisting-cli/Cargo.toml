[package]
name = "persisting-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Unified Persisting CLI over pVisor, pPilot, pChronicle, and Gateway"

[[bin]]
name = "persisting"
path = "src/main.rs"

[features]
default = []
dlcapt = ["dep:persisting-dlcapt"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
dirs.workspace = true
persisting-gateway.workspace = true
persisting-dlcapt = { path = "../persisting-dlcapt", optional = true }
persisting-pchronicle = { workspace = true, features = ["lance-store"] }
persisting-pchronicle-server.workspace = true
ron.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
uuid = { workspace = true, features = ["v4"] }
reqwest = { workspace = true, features = ["blocking", "rustls-tls"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "dlcapt_backend_e2e"
path = "tests/dlcapt_backend_e2e.rs"
required-features = ["dlcapt"]
