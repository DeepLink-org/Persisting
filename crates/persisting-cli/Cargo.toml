[package]
name = "persisting-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Unified Persisting CLI over pVisor, pPilot, pChronicle, and Gateway"

[[bin]]
name = "persisting"
path = "src/main.rs"

[features]
default = []
dlcapt = ["dep:persisting-dlcapt"]

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
persisting-gateway = { path = "../persisting-gateway" }
persisting-dlcapt = { path = "../persisting-dlcapt", optional = true }
persisting-pchronicle = { path = "../persisting-pchronicle" }
ron = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
termimad = "0.34"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "dlcapt_backend_e2e"
path = "tests/dlcapt_backend_e2e.rs"
required-features = ["dlcapt"]
