[package]
name = "persisting-pvisor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "pVisor: Portable Agent Execution Runtime"
readme = "README.md"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
persisting-access = { path = "../persisting-access" }
persisting-capture = { path = "../persisting-capture" }
persisting-overlayfs = { path = "../persisting-overlayfs" }
persisting-proto = { path = "../persisting-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
