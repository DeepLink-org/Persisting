[package]
name = "persisting-pvisor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "pVisor foreground Agent Run manager and portable execution runtime"
readme = "README.md"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
persisting-control = { path = "../persisting-control" }
persisting-gateway = { path = "../persisting-gateway" }
persisting-overlaynet = { path = "../persisting-overlaynet" }
persisting-overlayfs = { path = "../persisting-overlayfs" }
persisting-pchronicle = { path = "../persisting-pchronicle" }
persisting-proto = { path = "../persisting-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "signal", "sync", "time", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "pvisor"
path = "src/bin/pvisor.rs"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
