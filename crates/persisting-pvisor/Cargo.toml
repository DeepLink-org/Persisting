[package]
name = "persisting-pvisor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "pVisor foreground Agent Run manager and portable execution runtime"
readme = "README.md"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
libc.workspace = true
persisting-control.workspace = true
persisting-gateway.workspace = true
persisting-overlaynet.workspace = true
persisting-overlayfs.workspace = true
persisting-pchronicle.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time", "net"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { workspace = true, features = ["v4"] }

[[bin]]
name = "pvisor"
path = "src/bin/pvisor.rs"
