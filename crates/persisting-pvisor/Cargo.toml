[package]
name = "persisting-pvisor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "pVisor foreground Agent Run manager and portable execution runtime"
readme = "README.md"

[features]
default = []
lance-chronicle = ["persisting-pchronicle/lance-store"]
jujutsu-overlay = ["persisting-overlayfs/jujutsu"]
fuzzing = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
dirs.workspace = true
flate2.workspace = true
fs2.workspace = true
globset.workspace = true
libc.workspace = true
libkrun = { workspace = true, features = ["net"] }
persisting-agentctl.workspace = true
persisting-gateway.workspace = true
persisting-overlaynet.workspace = true
persisting-overlayfs = { workspace = true, default-features = false }
persisting-overlay-core.workspace = true
persisting-pchronicle = { workspace = true, default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
toml.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time", "net"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { workspace = true, features = ["v4"] }
zstd.workspace = true
reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls"] }

[[bin]]
name = "pvisor"
path = "src/bin/pvisor.rs"
