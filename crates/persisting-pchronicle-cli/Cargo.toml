[package]
name = "persisting-pchronicle-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Standalone pChronicle command-line interface"
readme = "README.md"

[[bin]]
name = "pchronicle"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
blake3.workspace = true
clap = { workspace = true, features = ["derive"] }
libc.workspace = true
persisting-pchronicle = { workspace = true, features = ["lance-store"] }
persisting-pchronicle-server.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
toml.workspace = true
url.workspace = true
