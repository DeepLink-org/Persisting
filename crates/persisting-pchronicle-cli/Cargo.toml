[package]
name = "persisting-pchronicle-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Standalone pChronicle command-line interface"
readme = "README.md"
build = "build.rs"

[[bin]]
name = "pchronicle"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["http1", "json", "query", "tokio"] }
blake3.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["derive"] }
datafusion = { workspace = true, features = ["sql"] }
futures.workspace = true
include_dir = "=0.7.4"
libc.workspace = true
persisting-gateway.workspace = true
persisting-pchronicle = { workspace = true, features = ["lance-store", "s3-store"] }
persisting-events = { workspace = true, features = ["control"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
http-body-util.workspace = true
persisting-agentctl.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
tower = { version = "0.5", features = ["util"] }
tracing-subscriber.workspace = true
