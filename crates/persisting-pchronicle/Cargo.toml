[package]
name = "persisting-pchronicle"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "pChronicle: Persisting's structured storage layer for Agent trajectories"
readme = "README.md"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = "0.4"
datafusion = { version = "53.1.0", default-features = false, features = ["sql"] }
futures = "0.3"
fs2 = "0.4"
lance = { version = "7.0.0", features = ["aws", "azure", "gcp"] }
lance-core = "7.0.0"
lance-index = "7.0.0"
lance-linalg = "7.0.0"
lance-table = "7.0.0"
object_store = "0.13.2"
persisting-control = { path = "../persisting-control" }
ron = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "atif_storyline_lance"
harness = false

[[bench]]
name = "lance_vs_json"
harness = false

[[test]]
name = "search_integration"
