[package]
name = "persisting-pchronicle"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "pChronicle: Canonical Run History Store (ATIF format support and rebuildable views)"
readme = "README.md"

[dependencies]
anyhow = "1"
ron = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
