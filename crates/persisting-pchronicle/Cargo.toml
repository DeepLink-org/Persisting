[package]
name = "persisting-pchronicle"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "pChronicle: Persisting's structured storage layer for Agent trajectories"
readme = "README.md"

[features]
default = ["lance-store"]
lance-store = [
    "dep:datafusion",
    "dep:futures",
    "dep:lance",
    "dep:lance-core",
    "dep:lance-file",
    "dep:lance-datafusion",
    "dep:lance-index",
    "dep:lance-linalg",
    "dep:lance-table",
    "dep:object_store",
]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
blake3.workspace = true
chrono.workspace = true
datafusion = { workspace = true, features = ["sql"], optional = true }
futures = { workspace = true, optional = true }
fs2.workspace = true
lance = { workspace = true, optional = true }
lance-core = { workspace = true, optional = true }
lance-file = { workspace = true, optional = true }
# Lance 9.0.1 does not forward `lance/protoc` to lance-datafusion.
lance-datafusion = { workspace = true, optional = true }
lance-index = { workspace = true, optional = true }
lance-linalg = { workspace = true, optional = true }
lance-table = { workspace = true, optional = true }
object_store = { workspace = true, optional = true }
persisting-agentctl.workspace = true
ron.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
serde_yaml.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread", "sync"] }
uuid = { workspace = true, features = ["v4", "v5"] }
zstd.workspace = true

[dev-dependencies]
libc.workspace = true
tempfile.workspace = true

[[bench]]
name = "atif_storyline_lance"
harness = false

[[bench]]
name = "lance_vs_json"
harness = false

[[bench]]
name = "json_streaming"
harness = false

[[test]]
name = "search_integration"
