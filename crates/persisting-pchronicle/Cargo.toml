[package]
name = "persisting-pchronicle"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "pChronicle: Persisting's structured storage layer for Agent trajectories"
readme = "README.md"

[features]
default = ["lance-store", "s3-store"]
lance-store = [
    "dep:datafusion",
    "dep:futures",
    "dep:lance",
    "dep:lance-arrow",
    "dep:lance-datafusion",
    "dep:lance-file",
    "dep:lance-index",
    "dep:object_store",
]
# Remote object stores are separated from the local Lance engine so pPilot and
# other local-only consumers do not compile cloud SDKs. `s3-store` remains a
# default feature for backwards compatibility; workspace dependencies disable
# defaults and opt into only the backend they use.
s3-store = ["lance-store", "lance/aws"]
oss-store = ["lance-store", "lance/oss"]
search = [
    "lance-store",
    "dep:lance-core",
    "dep:lance-linalg",
    "dep:lance-table",
]
# Property-based tests are opt-in so normal package tests do not compile the
# growing proptest target set. The dependency remains a dev-dependency and is
# available whenever these targets are explicitly enabled.
proptest = ["lance-store"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
blake3.workspace = true
chrono.workspace = true
datafusion = { workspace = true, features = ["sql"], optional = true }
futures = { workspace = true, optional = true }
fs2.workspace = true
lance = { workspace = true, optional = true }
lance-arrow = { workspace = true, optional = true }
lance-core = { workspace = true, optional = true }
lance-file = { workspace = true, optional = true }
lance-datafusion = { workspace = true, optional = true }
lance-index = { workspace = true, optional = true }
lance-linalg = { workspace = true, optional = true }
lance-table = { workspace = true, optional = true }
object_store = { workspace = true, optional = true }
persisting-agentctl.workspace = true
persisting-events.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value", "arbitrary_precision"] }
serde_yaml.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread", "sync"] }
tracing.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4", "v5"] }
zstd.workspace = true

[dev-dependencies]
criterion.workspace = true
libc.workspace = true
proptest.workspace = true
tempfile.workspace = true

[[bench]]
name = "pchronicle_criterion"
harness = false

[[bench]]
name = "lance_vs_json"
harness = false

[[bench]]
name = "json_streaming"
harness = false

[[bench]]
name = "projection_pipeline"
