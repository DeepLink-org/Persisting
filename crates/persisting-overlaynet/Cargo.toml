[package]
name = "persisting-overlaynet"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Lightweight HTTP proxy network overlay for pVisor"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["http1", "http2", "server", "tokio"] }
persisting-control = { path = "../persisting-control" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["net", "io-util", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
