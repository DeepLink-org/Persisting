[package]
name = "persisting-overlaynet"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Lightweight HTTP proxy network overlay for pVisor"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["http1", "tokio"] }
futures-util = { workspace = true, features = ["async-await", "std"] }
hyper.workspace = true
hyper-util = { workspace = true, features = ["tokio"] }
persisting-control.workspace = true
reqwest = { workspace = true, features = ["rustls-tls", "stream"] }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["net", "io-util", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
