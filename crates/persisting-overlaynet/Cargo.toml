[package]
name = "persisting-overlaynet"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Network interception and egress policy drivers for pVisor"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["http1", "tokio"] }
futures-util = { workspace = true, features = ["async-await", "std"] }
hyper.workspace = true
hyper-util = { workspace = true, features = ["tokio"] }
persisting-agentctl.workspace = true
reqwest = { workspace = true, features = ["rustls-tls", "stream"] }
serde = { workspace = true, features = ["derive"] }
smoltcp = { workspace = true, features = ["std", "log", "medium-ethernet", "proto-ipv4", "proto-dhcpv4", "proto-dns", "socket-tcp", "socket-udp", "socket-tcp-pause-synack"] }
tokio = { workspace = true, features = ["net", "io-util", "rt", "sync", "time"] }
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
http-body-util.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
