[package]
name = "persisting-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Rust core for Persisting (TTAS, block I/O, tiered loop, page fault)"

[features]
python-extension = ["pyo3/extension-module"]

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
persisting-pchronicle = { path = "../persisting-pchronicle" }
libc = "0.2"
# 与 pyproject.toml `requires-python >=3.10` 一致；解释器选择见 `.cargo/config.toml`。
pyo3 = { version = "0.23", default-features = false, features = ["abi3-py310", "macros"] }
pythonize = "0.23"
ron = "0.8"
serde = "1"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.6"
