[package]
name = "persisting-ppilot"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "pPilot durable Run orchestrator: plan, schedule, resume, reconcile, and collect independent Runs"
readme = "README.md"

[[bin]]
name = "ppilot"
path = "src/bin/ppilot.rs"
required-features = ["cli"]

[[test]]
name = "integration_pulsing_cluster"
required-features = ["query"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono = { workspace = true, optional = true }
clap = { workspace = true, features = ["derive", "env"] }
futures.workspace = true
persisting-gateway.workspace = true
persisting-pchronicle.workspace = true
persisting-control.workspace = true
persisting-pvisor.workspace = true
pulsing-actor = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tempfile = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time", "signal", "fs", "net"] }
tokio-stream.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { workspace = true, features = ["v4"] }

[features]
default = []
# Public `ppilot` command and DataFusion query surface. The core orchestrator
# always uses pVisor; this feature only adds the query-specific pChronicle API.
cli = ["query"]
query = ["dep:tempfile", "dep:toml"]
# Append pPilot results to Lance via TrajectoryAppend (Tee with JsonlFileSink).
traj-sink = ["dep:chrono"]

[dev-dependencies]
tempfile.workspace = true
