listen = "127.0.0.1:19081"
admin_listen = "127.0.0.1:19082"
store_dir = "var/store"
agent_id = "openclaw"
session_header = "x-persisting-session-id"
default_session_id = "default"
preserve_raw = false
base_session_path = "/v1/sessions"

[storage]
authoritative = "lance"
also = ["md", "json_cache"]

[storage.lance]
db_uri = "s3://example-invalid-bucket/dlcapt-deploy"
table_name = "session_steps"
fail_open = true

[storage.lance.s3]
region = "us-east-1"
endpoint = "http://s3.example.invalid:9000"
allow_http = true

[export.defaults]
env_name = "deploy"
job_id = "dlcapt"

[export.session_metadata]
source = "dlcapt-proxy"

[[models]]
name = "kimi-k2.5"
display_name = "Kimi K2.5"
provider = "openai"
upstream_base_url = "https://example.invalid/v1"
api_key = ""

[[models]]
name = "*"
display_name = "Fallback"
provider = "openai"
upstream_base_url = "https://example.invalid/v1"
api_key = ""
