[package]
name = "persisting-dlcapt"
version.workspace = true
edition = "2024"
authors.workspace = true
license.workspace = true
description = "Standalone OpenAI-compatible LLM proxy with session trajectory capture"

[[bin]]
name = "dlcapt"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arrow = "58.3.0"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["clock"] }
lance = { version = "7.0.0", features = ["protoc", "aws"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "io-util", "fs", "time"] }
tokio-stream = "0.1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
persisting-pchronicle = { path = "../persisting-pchronicle" }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
bytes = "1"
