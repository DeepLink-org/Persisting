[package]
name = "persisting-gateway"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Agent protocol gateway for forwarding and trajectory capture"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["http1", "json", "tokio"] }
bytes.workspace = true
chrono = { workspace = true, features = ["serde"] }
http-body-util.workspace = true
futures-util = { workspace = true, features = ["std"] }
reqwest = { workspace = true, features = ["rustls-tls", "stream"] }
ron.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
serde_yaml.workspace = true
dirs.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "net"] }
tokio-stream.workspace = true
tracing.workspace = true
url.workspace = true
regex.workspace = true
pulsing-actor = { workspace = true }
dashmap.workspace = true
blake3.workspace = true
hostname.workspace = true
persisting-agentctl.workspace = true
persisting-overlaynet.workspace = true
persisting-pchronicle = { workspace = true, default-features = false }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros"] }

[[test]]
name = "llm_fixtures"
path = "tests/llm_fixtures.rs"

[[test]]
name = "ag_fixture_tests"
path = "tests/ag_fixture_tests.rs"

[[test]]
name = "capture_apps_claude"
path = "tests/capture_apps_claude.rs"

[[test]]
name = "agenticmd_golden"
path = "tests/agenticmd_golden.rs"

[[test]]
name = "agenticmd_bridge"
path = "tests/agenticmd_bridge.rs"

[[test]]
name = "network_policy_http"
path = "tests/network_policy_http.rs"
