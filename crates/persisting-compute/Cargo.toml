[package]
name = "persisting-compute"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Thin compute control plane: plan script → streamed tasks → Pulsing workers (via `persisting compute`)"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", optional = true }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
persisting-capture = { path = "../persisting-capture", optional = true }
persisting-engine = { path = "../persisting-engine", optional = true }
persisting-proto = { path = "../persisting-proto", optional = true }
pulsing-actor = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time", "signal", "fs"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[features]
default = []
# Append compute results to Vortex via TrajectoryAppend (Tee with JsonlFileSink).
traj-sink = ["dep:chrono", "dep:persisting-capture", "dep:persisting-engine", "dep:persisting-proto"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
