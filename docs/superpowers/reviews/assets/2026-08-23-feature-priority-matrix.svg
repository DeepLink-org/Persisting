<svg viewBox="0 0 680 480" width="100%" xmlns="http://www.w3.org/2000/svg" role="img"><title>候选功能价值-成本矩阵</title><desc>按用户价值与实现成本排列的候选功能象限图。</desc>
<style>
  .ax { font-family: var(--font-sans, system-ui); font-size: 13px; font-weight: 500; fill: var(--color-text-secondary, #5f5e5a); }
  .lbl { font-family: var(--font-sans, system-ui); font-size: 12px; font-weight: 500; fill: var(--color-text-primary, #2c2c2a); }
  .q { font-family: var(--font-sans, system-ui); font-size: 12px; font-weight: 400; fill: var(--color-text-tertiary, #888780); }
</style>
<rect x="70" y="30" width="560" height="380" rx="10" fill="var(--color-background-secondary, #f1efe8)" stroke="var(--color-border-tertiary, rgba(0,0,0,.15))" stroke-width="0.5"/>
<line x1="350" y1="30" x2="350" y2="410" stroke="var(--color-border-secondary, rgba(0,0,0,.3))" stroke-width="0.5" stroke-dasharray="4 3"/>
<line x1="70" y1="220" x2="630" y2="220" stroke="var(--color-border-secondary, rgba(0,0,0,.3))" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="350" y="448" text-anchor="middle" class="ax">实现成本 →</text>
<text x="30" y="220" text-anchor="middle" class="ax" transform="rotate(-90 30 220)">用户价值 →</text>
<text x="86" y="52" class="q">高价值低成本 · 立即做</text>
<text x="470" y="52" class="q">高价值高成本 · 规划做</text>
<text x="86" y="400" class="q">顺手做</text>
<text x="470" y="400" class="q">暂缓</text>

<g><rect x="110" y="66" width="150" height="34" rx="17" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/><text x="185" y="87" text-anchor="middle" class="lbl">导出 HAR / OTLP 按钮</text></g>
<g><rect x="110" y="112" width="150" height="34" rx="17" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/><text x="185" y="133" text-anchor="middle" class="lbl">deep link 分享</text></g>
<g><rect x="110" y="158" width="150" height="34" rx="17" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/><text x="185" y="179" text-anchor="middle" class="lbl">catalog 自动刷新</text></g>
<g><rect x="290" y="66" width="132" height="34" rx="17" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/><text x="356" y="87" text-anchor="middle" class="lbl">schema 浏览器</text></g>
<g><rect x="290" y="112" width="132" height="34" rx="17" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/><text x="356" y="133" text-anchor="middle" class="lbl">error source 管理</text></g>

<g><rect x="480" y="66" width="138" height="34" rx="17" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/><text x="549" y="87" text-anchor="middle" class="lbl">trajectory compare</text></g>
<g><rect x="480" y="112" width="138" height="34" rx="17" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/><text x="549" y="133" text-anchor="middle" class="lbl">signals 检测器</text></g>
<g><rect x="480" y="158" width="138" height="34" rx="17" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/><text x="549" y="179" text-anchor="middle" class="lbl">revisions 时间旅行</text></g>
<g><rect x="480" y="204" width="138" height="34" rx="17" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/><text x="549" y="225" text-anchor="middle" class="lbl">报告导出（md/html）</text></g>

<g><rect x="110" y="250" width="150" height="34" rx="17" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/><text x="185" y="271" text-anchor="middle" class="lbl">多 dataset 切换器</text></g>
<g><rect x="110" y="296" width="150" height="34" rx="17" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/><text x="185" y="317" text-anchor="middle" class="lbl">/events 原始流视图</text></g>
<g><rect x="290" y="250" width="132" height="34" rx="17" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/><text x="356" y="271" text-anchor="middle" class="lbl">SQL 收藏 / 模板</text></g>
