<svg viewBox="0 0 680 460" width="100%" xmlns="http://www.w3.org/2000/svg" role="img"><title>Laminar 六个 Signal 的角色分工</title><desc>按问题阶段（意图/推理/输出）与受影响对象（agent/用户/任务）交叉划分的六类检测员。</desc>
<style>
  .axis { font-family: var(--font-sans, system-ui); font-size: 13px; font-weight: 500; fill: var(--color-text-secondary, #5f5e5a); }
  .card-title { font-family: var(--font-sans, system-ui); font-size: 13px; font-weight: 500; fill: var(--color-text-primary, #2c2c2a); }
  .card-desc { font-family: var(--font-sans, system-ui); font-size: 11px; font-weight: 400; fill: var(--color-text-secondary, #5f5e5a); }
  .cell { rx: 10; stroke-width: 0.5; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="340" y="28" text-anchor="middle" class="axis">问题阶段 →</text>
<text x="24" y="250" text-anchor="middle" class="axis" transform="rotate(-90 24 250)">受影响对象 →</text>

<rect x="100" y="44" width="170" height="34" rx="6" fill="var(--color-background-secondary, #f1efe8)" stroke="var(--color-border-tertiary, rgba(0,0,0,.15))"/>
<text x="185" y="65" text-anchor="middle" class="axis">意图理解</text>
<rect x="282" y="44" width="170" height="34" rx="6" fill="var(--color-background-secondary, #f1efe8)" stroke="var(--color-border-tertiary, rgba(0,0,0,.15))"/>
<text x="367" y="65" text-anchor="middle" class="axis">推理与执行</text>
<rect x="464" y="44" width="170" height="34" rx="6" fill="var(--color-background-secondary, #f1efe8)" stroke="var(--color-border-tertiary, rgba(0,0,0,.15))"/>
<text x="549" y="65" text-anchor="middle" class="axis">输出验证</text>

<rect x="16" y="90" width="72" height="100" rx="6" fill="var(--color-background-secondary, #f1efe8)" stroke="var(--color-border-tertiary, rgba(0,0,0,.15))"/>
<text x="52" y="145" text-anchor="middle" class="axis">agent / trace</text>
<rect x="16" y="202" width="72" height="100" rx="6" fill="var(--color-background-secondary, #f1efe8)" stroke="var(--color-border-tertiary, rgba(0,0,0,.15))"/>
<text x="52" y="257" text-anchor="middle" class="axis">用户 / 体验</text>
<rect x="16" y="314" width="72" height="100" rx="6" fill="var(--color-background-secondary, #f1efe8)" stroke="var(--color-border-tertiary, rgba(0,0,0,.15))"/>
<text x="52" y="369" text-anchor="middle" class="axis">任务 / 目标</text>

<g transform="translate(100,90)">
  <rect width="170" height="100" class="cell" fill="#FAEEDA" stroke="#854F0B"/>
  <text x="16" y="28" class="card-title">intent classifier</text>
  <text x="16" y="48" class="card-desc">classify what the user</text>
  <text x="16" y="62" class="card-desc">was trying to accomplish</text>
</g>

<g transform="translate(282,90)">
  <rect width="170" height="48" class="cell" fill="#F5C4B3" stroke="#993C1D"/>
  <text x="16" y="22" class="card-title">failure detector</text>
  <text x="16" y="38" class="card-desc">errors, loops, wrong tools</text>
</g>
<g transform="translate(282,142)">
  <rect width="170" height="48" class="cell" fill="#CECBF6" stroke="#534AB7"/>
  <text x="16" y="22" class="card-title">logic analyzer</text>
  <text x="16" y="38" class="card-desc">flaws in reasoning</text>
</g>

<g transform="translate(464,90)">
  <rect width="170" height="48" class="cell" fill="#B5D4F4" stroke="#185FA5"/>
  <text x="16" y="22" class="card-title">hallucination detector</text>
  <text x="16" y="38" class="card-desc">made-up facts &amp; claims</text>
</g>
<g transform="translate(464,142)">
  <rect width="170" height="48" class="cell" fill="#C0DD97" stroke="#3B6D11"/>
  <text x="16" y="22" class="card-title">task evaluator</text>
  <text x="16" y="38" class="card-desc">completed the request?</text>
</g>

<g transform="translate(282,202)">
  <rect width="352" height="100" class="cell" fill="#F4C0D1" stroke="#993556"/>
  <text x="16" y="28" class="card-title">friction detector</text>
  <text x="16" y="48" class="card-desc">identify user frustration and poor UX</text>
</g>

<g transform="translate(100,314)">
  <rect width="534" height="100" class="cell" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="16" y="28" class="card-title" style="fill:#5F5E5A">cross-cutting: task success</text>
  <text x="16" y="48" class="card-desc">task evaluator &amp; intent classifier jointly answer</text>
  <text x="16" y="62" class="card-desc">"did the agent do what the user actually wanted?"</text>
</g>
</svg>
