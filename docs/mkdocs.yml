site_name: Persisting
site_description: Persistent Storage for Parameters, KV Cache, and Trajectories
site_url: https://github.com/DeepLink-org/Persisting
docs_dir: src

repo_name: DeepLink-org/Persisting
repo_url: https://github.com/DeepLink-org/Persisting

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
          site_name: "Persisting Documentation"
        - locale: zh
          name: 中文
          build: true
          site_name: "Persisting 文档"
          nav_translations:
            Home: 首页
            Start Here: 开始使用
            Installation: 安装指南
            Quick Start: 快速开始
            Choose a Capability: 选择能力
            User Guide: 用户指南
            Guides: 使用指南
            Capture: 轨迹采集
            Queue: 队列
            Tensor Memory: 张量内存
            Search: 检索
            pPilot: pPilot 编排
            Custom Backends: 自定义后端
            API Reference: API 参考
            Reference: 参考
            Design: 设计文档
            Architecture & Internals: 架构与内部实现
            Engineering Notes: 工程笔记
            Implementation status: 实现状态
            Tiered-storage implementation steps: 分层存储实现步骤
            Research Notes: 调研笔记
            Architecture: 架构设计
            Distributed Tiered Storage: 分布式分层存储
            Trajectory Storage: 轨迹存储模型
            Trajectory Format: 轨迹 Markdown 格式
            CLI Architecture: CLI 整体架构
            Traj CLI: Traj 命令
            Capture CLI: Capture 子命令
            Search CLI: Search 命令
            pPilot Architecture: pPilot 架构
            References: 参考
            Similar Systems: 类似系统
            TransferQueue Comparison: TransferQueue 对比
            LMCache: LMCache 参考
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            docstring_options:
              ignore_init_summary: yes
            merge_init_into_class: yes
            show_submodules: no

nav:
  - Home: index.md
  - Start Here:
      - Installation: installation.md
      - Quick Start: quickstart.md
      - Choose a Capability: guide/index.md
  - Guides:
      - Capture agent trajectories: guide/capture.md
      - Run batches with pPilot: guide/ppilot.md
      - Index and search documents: guide/search.md
      - Stream events with Queue: guide/queue.md
      - Use Tensor Memory (experimental): guide/tensor-memory.md
      - Build a custom queue backend: guide/custom-backends.md
  - Reference:
      - Python API overview: api/index.md
      - Tensor Memory API: api/tensor-memory.md
      - Queue API: api/queue.md
      - Search API: api/search.md
      - TTAS types: api/tensor-address-space.md
      - CLI architecture and loading: design/cli.md
      - traj command reference: design/cli-traj.md
      - Capture command reference: design/cli-capture.md
      - search command reference: design/cli-search.md
  - Architecture & Internals:
      - Overview and maturity: design/index.md
      - Agent infrastructure: design/agent-infrastructure.md
      - Queue persistence: design/architecture.md
      - Capture and trajectory:
          - Capture pipeline: design/capture.md
          - Trajectory storage: design/trajectory.md
          - Trajectory Markdown format: design/trajectory-format.md
      - pPilot control plane: design/ppilot.md
      - Tensor memory (experimental):
          - TTAS model: design/tensor-address-space.md
          - Distributed tiered storage: design/distributed-tiered-storage.md
          - BlockStore internals: design/block-store.md
  - RFCs:
      - Index: rfcs/index.md
      - 0001 Storyline format: rfcs/0001-storyline-format.md
      - 0002 Events format: rfcs/0002-events-format.md
  - Engineering Notes:
      - Implementation status: dev/index.md
      - Tiered-storage implementation steps: dev/tiered-storage-steps.md
  - Research Notes:
      - Similar systems: design/references/similar-systems.md
      - TransferQueue comparison: design/references/transfer-queue-comparison.md
      - TransferQueue interface mapping: design/references/transfer-queue-interface.md
      - LMCache analysis: design/references/lmcache.md

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DeepLink-org/Persisting

extra_css:
  - assets/stylesheets/home.css

