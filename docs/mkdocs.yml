site_name: Persisting
site_description: Persistent Storage for Parameters, KV Cache, and Trajectories
site_url: https://github.com/DeepLink-org/Persisting
docs_dir: src

repo_name: DeepLink-org/Persisting
repo_url: https://github.com/DeepLink-org/Persisting

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
          site_name: "Persisting Documentation"
        - locale: zh
          name: 中文
          build: true
          site_name: "Persisting 文档"
          nav_translations:
            Home: 首页
            Installation: 安装指南
            Quick Start: 快速开始
            User Guide: 用户指南
            Capture: 轨迹采集
            Queue: 队列
            Tensor Memory: 张量内存
            Search: 检索
            Compute: 计算编排
            Custom Backends: 自定义后端
            API Reference: API 参考
            Design: 设计文档
            Architecture: 架构设计
            Distributed Tiered Storage: 分布式分层存储
            Trajectory Storage: 轨迹存储模型
            Trajectory Format: 轨迹 Markdown 格式
            CLI Architecture: CLI 整体架构
            Traj CLI: Traj 命令
            Capture CLI: Capture 子命令
            Search CLI: Search 命令
            Compute Architecture: Compute 架构
            References: 参考
            Similar Systems: 类似系统
            TransferQueue Comparison: TransferQueue 对比
            LMCache: LMCache 参考
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            docstring_options:
              ignore_init_summary: yes
            merge_init_into_class: yes
            show_submodules: no

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start: quickstart.md
  - User Guide:
      - guide/index.md
      - Capture: guide/capture.md
      - Queue: guide/queue.md
      - Tensor Memory: guide/tensor-memory.md
      - Search: guide/search.md
      - Compute: guide/compute.md
      - Custom Backends: guide/custom-backends.md
  - API Reference:
      - api/index.md
      - Tensor Memory: api/tensor-memory.md
      - Queue: api/queue.md
      - Search: api/search.md
      - Tensor Address Space: api/tensor-address-space.md
  - Design:
      - design/index.md
      - Architecture: design/architecture.md
      - Tiered Storage:
          - Tensor Address Space: design/tensor-address-space.md
          - Distributed Tiered Storage: design/distributed-tiered-storage.md
          - Block Store Internals: design/block-store.md
      - Capture & Trajectory:
          - Capture Architecture: design/capture.md
          - Trajectory Storage: design/trajectory.md
          - Trajectory Format: design/trajectory-format.md
          - Traj CLI: design/cli-traj.md
          - Capture CLI: design/cli-capture.md
      - CLI Architecture: design/cli.md
      - Compute Architecture: design/compute.md
      - Search CLI: design/cli-search.md
      - References:
          - Similar Systems: design/references/similar-systems.md
          - TransferQueue Comparison: design/references/transfer-queue-comparison.md
          - TransferQueue Interface: design/references/transfer-queue-interface.md
          - LMCache: design/references/lmcache.md

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DeepLink-org/Persisting

extra_css:
  - assets/stylesheets/home.css

