site_name: Persisting
site_description: Persistent infrastructure for the Agent era—from model parameters and KV caches to Agent trajectories
site_url: https://deeplink-org.github.io/Persisting/
docs_dir: src

repo_name: DeepLink-org/Persisting
repo_url: https://github.com/DeepLink-org/Persisting

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
          site_name: "Persisting Documentation"
        - locale: zh
          name: 中文
          build: true
          site_name: "Persisting 文档"
          nav_translations:
            Home: 首页
            pVisor: pVisor
            pChronicle: pChronicle
            Overview: 概览
            Concepts: 核心概念
            Start here: 从这里开始
            Choose a workflow: 选择工作流
            Get Started: 快速开始
            Guides: 指南
            Design: 设计
            Reference: 参考
            Project: 项目
            Architecture: 架构
            System overview: 系统概览
            AgentVisor category: AgentVisor 品类
            Run, Attempt, and Effect: Run、Attempt 与 Effect
            Capabilities and evidence: Capability 与 Evidence
            Guides overview: 指南概览
            Design overview: 设计概览
            Reference overview: 参考概览
            Execution environments: 执行环境
            Review and apply effects: 审查并应用 Effect
            Network control: 网络控制
            Capture trajectories: 捕获轨迹
            Replay Agent trajectories: 回放 Agent 轨迹
            Isolation architecture: 隔离架构
            Gateway architecture: Gateway 架构
            OverlayNet architecture: OverlayNet 架构
            pVisor CLI: pVisor CLI
            Dataset interface: Dataset 接口
            Dataset discovery and versioning: Dataset 发现与版本固定
            Recorded data, views, and versions: 记录数据、视图与版本
            Discover and query: 发现与查询
            Import and export: 导入与导出
            Local read-only Dataset server: 本地只读 Dataset 服务
            Local Dataset Web UI: 本地 Dataset Web UI
            Gateway forwarding, rewriting, and capture: Gateway 转发、改写与捕获
            Orchestrate many Agent Runs: 编排多个 Agent Run
            Orchestration architecture: 编排架构
            pPilot CLI: pPilot CLI
            Product architecture: 产品架构
            Run storage: 运行存储
            Storyline Lance projection: Storyline Lance 投影
            pChronicle reference: pChronicle 参考
            Product terminology: 产品术语
            AgenticMD format: AgenticMD 格式
            Run data formats: 运行数据格式
            End-to-end architecture: 端到端架构
            Local to fleet: 从本地到集群
            Security and evidence: 安全与 Evidence
            Engineering: 工程
            Engineering Notes: 工程说明
            Releasing persisting: 发布 Persisting
            Reproducible examples: 可复现示例
            Decisions and RFCs: 决策与 RFC
            Index: 索引
            0001 Storyline format: 0001 Storyline 格式
            0002 Events format: 0002 Events 格式
            0003 pChronicle ownership: 0003 pChronicle 所有权
            0004 ACTF format: 0004 ACTF 格式
            0005 pChronicle revision lineage: 0005 pChronicle 修订谱系
            0006 pChronicle Vortex backend: 0006 pChronicle Vortex 后端
            0007 Events contract and pChronicle sidecar: 0007 事件契约与 pChronicle Sidecar
            0008 ATIF format: 0008 ATIF 格式
            0009 OpenAI Messages format: 0009 OpenAI Messages 格式
            0010 Agent corpus Lance layout: 0010 Agent 评测语料 Lance 布局
            0012 pChronicle find query syntax: 0012 pChronicle find 查询语法
            0013 pChronicle path Directory: 0013 pChronicle path Directory
            Standalone systems: 独立系统
            Installation: 安装指南
            pChronicle CLI: pChronicle 命令参考
            Query model: Query Model
            Snapshot: Snapshot
            Queue guide: Queue 指南
            Python API overview: Python API 概览
            Queue API: Queue API
            Custom queue backends: 自定义 Queue backend
            Queue persistence: Queue 持久化
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            docstring_options:
              ignore_init_summary: yes
            merge_init_into_class: yes
            show_submodules: no

