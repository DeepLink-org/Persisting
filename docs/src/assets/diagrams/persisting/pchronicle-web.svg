<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">pChronicle Web build and runtime</title><desc id="desc">Dioxus components are bundled into static assets and embedded in the native server. At runtime the browser talks to the Axum REST API, which holds immutable catalog state, source routing, and a read-only query engine over local and object-store sources.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#17233a"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:32px;font-weight:700;fill:#f8fafc}.sub{font-size:16px;fill:#94a3b8}.zone{font-size:13px;font-weight:750;letter-spacing:1.2px;fill:#5eead4}.label{font-size:16px;font-weight:700;fill:#f8fafc}.tiny{font-size:12px;fill:#94a3b8}.box{fill:#111c2e;stroke:#40516a;stroke-width:1.5}.accent{fill:#10333a;stroke:#5eead4;stroke-width:1.8}.line{fill:none;stroke:#7dd3fc;stroke-width:2.1;marker-end:url(#a)}</style></defs>
  <rect width="1400" height="720" rx="26" fill="url(#bg)"/><text x="48" y="54" class="title">pChronicle Web: build once, serve read-only</text><text x="48" y="82" class="sub">The Web application is a consumer of pChronicle, not another source of truth</text>
  <rect x="42" y="118" width="1316" height="176" rx="22" fill="#0b1728" stroke="#334155"/><text x="70" y="151" class="zone">BUILD AND PACKAGE</text>
  <rect x="72" y="178" width="210" height="78" rx="15" class="box"/><text x="102" y="210" class="label">Dioxus components</text><text x="102" y="233" class="tiny">pchronicle-web</text><path d="M282 217H326" class="line"/>
  <rect x="329" y="178" width="210" height="78" rx="15" class="box"/><text x="359" y="210" class="label">dx bundle --release</text><text x="359" y="233" class="tiny">pre-compressed bundle</text><path d="M539 217H583" class="line"/>
  <rect x="586" y="178" width="210" height="78" rx="15" class="box"/><text x="616" y="210" class="label">web-assets/public</text><text x="616" y="233" class="tiny">WASM · JS · CSS · HTML</text><path d="M796 217H840" class="line"/>
  <rect x="843" y="178" width="210" height="78" rx="15" class="box"/><text x="873" y="210" class="label">server build.rs</text><text x="873" y="233" class="tiny">generated or fallback assets</text><path d="M1053 217H1097" class="line"/>
  <rect x="1100" y="178" width="220" height="78" rx="15" class="accent"/><text x="1130" y="210" class="label">native binary</text><text x="1130" y="233" class="tiny">assets embedded with include_dir</text>
  <path d="M1210 256V336" class="line"/>
  <rect x="42" y="338" width="1316" height="330" rx="22" fill="#0d1c2d" stroke="#334155"/><text x="70" y="373" class="zone">LOOPBACK RUNTIME</text>
  <rect x="72" y="422" width="230" height="100" rx="16" class="box"/><text x="102" y="460" class="label">Dioxus application</text><text x="102" y="484" class="tiny">Dataset · Runs · timeline</text><text x="102" y="506" class="tiny">events · tools · filters</text>
  <path d="M302 472H368" class="line"/>
  <rect x="371" y="422" width="180" height="100" rx="16" class="accent"/><text x="405" y="460" class="label">Axum /api</text><text x="405" y="486" class="tiny">read-only REST</text><text x="405" y="508" class="tiny">explicit refresh</text>
  <path d="M551 472H617" class="line"/>
  <rect x="620" y="410" width="205" height="124" rx="16" class="box"/><text x="650" y="450" class="label">AppState</text><text x="650" y="476" class="tiny">mount config</text><text x="650" y="498" class="tiny">immutable catalog snapshot</text><text x="650" y="520" class="tiny">generation-scoped routing</text>
  <path d="M825 450H889" class="line"/><path d="M825 502H889" class="line"/>
  <rect x="892" y="390" width="220" height="108" rx="16" class="box"/><text x="922" y="430" class="label">Dataset sources</text><text x="922" y="456" class="tiny">local · S3 · object prefixes</text><text x="922" y="478" class="tiny">events · ATIF · ACTF · Storyline</text>
  <rect x="892" y="526" width="220" height="108" rx="16" class="box"/><text x="922" y="566" class="label">Query engine</text><text x="922" y="592" class="tiny">Dataset schemas</text><text x="922" y="614" class="tiny">source pruning · read-only SQL</text>
  <path d="M1112 444H1190V580H1112" class="line"/>
  <rect x="1188" y="478" width="132" height="100" rx="16" class="box"/><text x="1217" y="518" class="label">Views</text><text x="1217" y="544" class="tiny">Runs</text><text x="1217" y="565" class="tiny">events · spans</text>
</svg>
