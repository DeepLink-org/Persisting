<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Persisting workflows and optional integration</title>
  <desc id="desc">pVisor runs one Agent with a reviewable execution boundary, while pChronicle queries trajectory Datasets. Execution and history are independent starting points that can be connected by configured capture.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#17233a"/>
    </linearGradient>
    <linearGradient id="visor-domain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102f43"/>
      <stop offset="1" stop-color="#0d2d35"/>
    </linearGradient>
    <linearGradient id="chronicle-domain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172b3c"/>
      <stop offset="1" stop-color="#173527"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#7dd3fc"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-size: 17px; fill: #94a3b8; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.25px; fill: #7dd3fc; }
      .domain-title { font-size: 25px; font-weight: 700; fill: #f8fafc; }
      .card-title { font-size: 18px; font-weight: 700; fill: #f8fafc; }
      .body { font-size: 16px; fill: #cbd5e1; }
      .small { font-size: 14px; fill: #94a3b8; }
      .input-card { fill: #111c2e; stroke: #40516a; stroke-width: 1.6; }
      .domain-shell { stroke-width: 2; }
      .pvisor-shell { fill: url(#visor-domain); stroke: #5eead4; }
      .chronicle-shell { fill: url(#chronicle-domain); stroke: #86efac; }
      .inner-card { fill: #0b1728; stroke: #40516a; stroke-width: 1.5; }
      .visor-card { stroke: #2b6170; }
      .chronicle-card { stroke: #315944; }
      .chronicle-accent { fill: #86efac; }
      .handoff-label { fill: #bae6fd; }
      .input-line { fill: none; stroke: #7dd3fc; stroke-width: 2.4; marker-end: url(#arrow); }
      .handoff-line { fill: none; stroke: #7dd3fc; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="780" rx="28" fill="url(#background)"/>
  <text x="52" y="56" class="title">Persisting product paths and optional integration</text>
  <text x="52" y="86" class="subtitle">pVisor governs execution; pChronicle preserves queryable history</text>

  <text x="70" y="119" class="eyebrow">Inputs</text>
  <g id="agent-task-input" filter="url(#shadow)">
    <rect x="70" y="137" width="500" height="74" rx="18" class="input-card"/>
    <text x="100" y="182" class="card-title">Agent command / task</text>
  </g>
  <g id="external-producer-input" filter="url(#shadow)">
    <rect x="830" y="137" width="500" height="74" rx="18" class="input-card"/>
    <text x="860" y="182" class="card-title">Pinned external Sources</text>
  </g>

  <path d="M320 211V246" class="input-line"/>
  <path d="M1080 211V246" class="input-line"/>

  <g id="pvisor-domain" filter="url(#shadow)">
    <rect x="70" y="250" width="500" height="410" rx="24" class="domain-shell pvisor-shell"/>
    <text x="100" y="290" class="eyebrow">EXECUTION PATH</text>
    <text x="100" y="324" class="domain-title">pVisor: controlled execution</text>

    <rect x="100" y="351" width="440" height="106" rx="16" class="inner-card visor-card"/>
    <text x="124" y="395" class="body">pVisor: one governed Run per Agent</text>
    <text x="124" y="426" class="small">review, apply, or drop staged changes</text>

    <rect x="100" y="518" width="440" height="114" rx="16" class="inner-card"/>
    <text x="124" y="568" class="body">Host · OCI container · libkrun VM</text>
    <text x="124" y="599" class="small">provider boundary and Evidence recorded with the Run</text>
  </g>

  <g id="pchronicle-domain" filter="url(#shadow)">
    <rect x="830" y="250" width="500" height="410" rx="24" class="domain-shell chronicle-shell"/>
    <text x="860" y="290" class="eyebrow chronicle-accent">HISTORY PATH</text>
    <text x="860" y="324" class="domain-title">pChronicle: trajectory Datasets</text>

    <rect x="860" y="351" width="440" height="106" rx="16" class="inner-card chronicle-card"/>
    <text x="884" y="411" class="body">local/S3 files · Storyline Sources · @alias</text>

    <rect x="860" y="518" width="440" height="114" rx="16" class="inner-card chronicle-card"/>
    <text x="884" y="583" class="body">Snapshot · normalize · query · analyze · exchange</text>
  </g>

  <g id="integration-handoff">
    <rect x="590" y="340" width="220" height="132" rx="18" fill="#101c30" stroke="#60a5fa" stroke-width="1.7"/>
    <text x="700" y="370" text-anchor="middle" class="eyebrow">OPTIONAL CAPTURE</text>
    <text x="700" y="399" text-anchor="middle" class="small">Gateway trajectory events</text>
    <text x="700" y="423" text-anchor="middle" class="small">pVisor lifecycle records</text>
    <text x="700" y="447" text-anchor="middle" class="small">recorded execution context</text>
    <path d="M570 500H830" class="handoff-line"/>
    <rect x="602" y="483" width="196" height="34" rx="17" fill="#17233a" stroke="#60a5fa" stroke-width="1.4"/>
    <text x="700" y="505" text-anchor="middle" class="small handoff-label">configured capture</text>
  </g>

  <g id="shared-contract" filter="url(#shadow)">
    <rect x="70" y="693" width="1260" height="59" rx="18" fill="#101c30" stroke="#60a5fa" stroke-width="1.7"/>
    <text x="100" y="728" class="card-title">Shared principle</text>
    <text x="278" y="728" class="body">keep reusable state durable; keep completed work inspectable</text>
  </g>
</svg>
