<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">pChronicle product boundary</title><desc id="desc">Gateway, native writers, and files produce a local or S3 Dataset. pChronicle Core discovers and normalizes it for query, analysis, find, import, export, and a read-only Warehouse API and Web interface.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#17233a"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:32px;font-weight:700;fill:#f8fafc}.sub{font-size:16px;fill:#94a3b8}.label{font-size:18px;font-weight:700;fill:#f8fafc}.tiny{font-size:13px;fill:#94a3b8}.box{fill:#111c2e;stroke:#40516a;stroke-width:1.6}.accent{fill:#10333a;stroke:#5eead4;stroke-width:2}.line{fill:none;stroke:#7dd3fc;stroke-width:2.3;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="500" rx="26" fill="url(#bg)"/><text x="48" y="55" class="title">pChronicle product boundary</text><text x="48" y="84" class="sub">Path-first trajectory Datasets · local and S3 · read-oriented product surface</text>
  <rect x="55" y="160" width="220" height="112" rx="18" class="box"/><text x="85" y="202" class="label">Producers</text><text x="85" y="231" class="tiny">Gateway · native writer</text><text x="85" y="253" class="tiny">ATIF · ACTF · files</text>
  <path d="M275 216H340" class="line"/>
  <rect x="343" y="160" width="220" height="112" rx="18" class="box"/><text x="373" y="202" class="label">Dataset URI</text><text x="373" y="231" class="tiny">local directory or S3 prefix</text><text x="373" y="253" class="tiny">identity stays path-first</text>
  <path d="M563 216H628" class="line"/>
  <rect x="631" y="145" width="250" height="142" rx="20" class="accent"/><text x="667" y="194" class="label">pChronicle Core</text><text x="667" y="224" class="tiny">discover · pin snapshot</text><text x="667" y="246" class="tiny">normalize · query · exchange</text><text x="667" y="268" class="tiny">read-only execution boundary</text>
  <path d="M881 190H947" class="line"/><path d="M881 248H947" class="line"/>
  <rect x="950" y="130" width="200" height="96" rx="18" class="box"/><text x="979" y="170" class="label">CLI</text><text x="979" y="198" class="tiny">query · analysis · find</text>
  <rect x="950" y="250" width="200" height="96" rx="18" class="box"/><text x="979" y="290" class="label">Exchange</text><text x="979" y="318" class="tiny">import · export</text>
  <rect x="631" y="350" width="519" height="82" rx="18" class="box"/><text x="661" y="383" class="label">Read-only Warehouse</text><text x="661" y="409" class="tiny">static mounts · loopback API · Web · reconstructible cache</text>
  <path d="M756 287V350" class="line"/>
</svg>
