<svg xmlns="http://www.w3.org/2000/svg" width="1325" height="560" viewBox="0 0 1325 560" role="img" aria-labelledby="title desc">
  <title id="title">pChronicle product boundary</title>
  <desc id="desc">External evaluators, Agent frameworks, exchange files, Gateway, pVisor, and native writers produce Sources identified by a local or S3 Dataset URI. pChronicle Core discovers and pins a Snapshot, normalizes and queries data, persists canonical events, and exchanges formats for CLI query and analysis, import, export and revisions, and a read-only Warehouse API and Web interface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#08111f"/>
      <stop offset="1" stop-color="#17233a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#7dd3fc"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 32px; font-weight: 700; fill: #f8fafc; }
      .sub { font-size: 16px; fill: #94a3b8; }
      .label { font-size: 18px; font-weight: 700; fill: #f8fafc; }
      .tiny { font-size: 13px; fill: #cbd5e1; }
      .box { fill: #111c2e; stroke: #40516a; stroke-width: 1.6; }
      .accent { fill: #10333a; stroke: #5eead4; stroke-width: 2; }
      .line { fill: none; stroke: #7dd3fc; stroke-width: 2.3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1325" height="560" rx="26" fill="url(#bg)"/>
  <text x="48" y="55" class="title">pChronicle product boundary</text>
  <text x="48" y="84" class="sub">Dataset-first trajectory data · local and S3 · bounded read and exchange surfaces</text>

  <g id="producers">
    <rect x="40" y="203" width="380" height="122" rx="18" class="box"/>
    <text x="65" y="239" class="label">Producers</text>
    <text x="65" y="272" class="tiny">External evaluators · Agent frameworks · exchange files</text>
    <text x="65" y="299" class="tiny">Gateway · pVisor · native writers</text>
  </g>

  <path d="M420 264H462" class="line"/>

  <g id="dataset-boundary">
    <rect x="465" y="203" width="225" height="122" rx="18" class="box"/>
    <text x="491" y="247" class="label">Sources / Dataset URI</text>
    <text x="491" y="278" class="tiny">local storage or S3</text>
    <text x="491" y="302" class="tiny">Source-local identity</text>
  </g>

  <path d="M690 264H732" class="line"/>

  <g id="pchronicle-core">
    <rect x="735" y="182" width="260" height="164" rx="20" class="accent"/>
    <text x="764" y="220" class="label">pChronicle Core</text>
    <text x="764" y="254" class="tiny">discover · pin Snapshot</text>
    <text x="764" y="279" class="tiny">normalize · query</text>
    <text x="764" y="304" class="tiny">persist canonical events</text>
    <text x="764" y="329" class="tiny">exchange</text>
  </g>

  <path d="M995 222H1037" class="line"/>
  <path d="M995 264H1015V342H1037" class="line"/>
  <path d="M865 346V456H1037" class="line"/>

  <g id="cli-output">
    <rect x="1040" y="170" width="245" height="92" rx="18" class="box"/>
    <text x="1066" y="207" class="label">CLI</text>
    <text x="1066" y="235" class="tiny">query · analysis</text>
  </g>

  <g id="exchange-output">
    <rect x="1040" y="288" width="245" height="108" rx="18" class="box"/>
    <text x="1066" y="326" class="label">Exchange + lineage</text>
    <text x="1066" y="354" class="tiny">import · export</text>
    <text x="1066" y="377" class="tiny">revisions</text>
  </g>

  <g id="warehouse-output">
    <rect x="1040" y="420" width="245" height="82" rx="18" class="box"/>
    <text x="1066" y="454" class="label">Read-only Warehouse</text>
    <text x="1066" y="481" class="tiny">API · Web</text>
  </g>
</svg>
