<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Gateway request capture sequence</title><desc id="desc">An Agent sends a request through the capture proxy. The proxy emits the request event and forwards upstream. Streaming drafts update handlers while SSE continues to the Agent. On cancellation Lance records cancel; on completion Lance records the final response and handlers finalize derived views.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#17233a"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:32px;font-weight:700;fill:#f8fafc}.sub{font-size:16px;fill:#94a3b8}.actor{font-size:15px;font-weight:700;fill:#f8fafc}.msg{font-size:12px;fill:#cbd5e1}.phase{font-size:12px;font-weight:750;letter-spacing:1.1px;fill:#5eead4}.head{fill:#111c2e;stroke:#40516a;stroke-width:1.5}.life{stroke:#475569;stroke-width:1.2;stroke-dasharray:5 6}.line{fill:none;stroke:#7dd3fc;stroke-width:2;marker-end:url(#a)}.return{fill:none;stroke:#86efac;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#a)}</style></defs>
  <rect width="1400" height="760" rx="26" fill="url(#bg)"/><text x="48" y="54" class="title">One captured conversation request</text><text x="48" y="82" class="sub">The response path does not wait for derived-format persistence</text>
  <g><rect x="55" y="118" width="150" height="62" rx="14" class="head"/><text x="107" y="156" class="actor">Agent</text><rect x="273" y="118" width="170" height="62" rx="14" class="head"/><text x="310" y="156" class="actor">Capture proxy</text><rect x="511" y="118" width="160" height="62" rx="14" class="head"/><text x="550" y="156" class="actor">Event flow</text><rect x="739" y="118" width="160" height="62" rx="14" class="head"/><text x="779" y="156" class="actor">events.lance</text><rect x="967" y="118" width="160" height="62" rx="14" class="head"/><text x="1014" y="156" class="actor">Handlers</text><rect x="1195" y="118" width="150" height="62" rx="14" class="head"/><text x="1235" y="156" class="actor">Upstream</text></g>
  <g><path d="M130 180V706" class="life"/><path d="M358 180V706" class="life"/><path d="M591 180V706" class="life"/><path d="M819 180V706" class="life"/><path d="M1047 180V706" class="life"/><path d="M1270 180V706" class="life"/></g>
  <text x="55" y="220" class="phase">REQUEST</text><path d="M130 245H358" class="line"/><text x="193" y="235" class="msg">conversation request</text><path d="M358 282H591" class="line"/><text x="405" y="272" class="msg">emit request event</text><path d="M591 319H819" class="line"/><text x="650" y="309" class="msg">append canonical request</text><path d="M591 356H1047" class="line"/><text x="740" y="346" class="msg">trigger Storyline / Markdown</text><path d="M358 393H1270" class="line"/><text x="724" y="383" class="msg">forward upstream</text>
  <text x="55" y="449" class="phase">STREAM</text><path d="M1270 474H358" class="return"/><text x="743" y="464" class="msg">streaming response</text><path d="M358 511H591" class="line"/><text x="417" y="501" class="msg">optional draft</text><path d="M591 548H1047" class="line"/><text x="730" y="538" class="msg">live view upsert</text><path d="M358 585H130" class="return"/><text x="202" y="575" class="msg">forward SSE</text>
  <text x="55" y="638" class="phase">TERMINAL</text><path d="M358 662H591" class="line"/><text x="396" y="652" class="msg">cancel or response complete</text><path d="M591 699H819" class="line"/><text x="639" y="689" class="msg">append terminal fact</text><path d="M591 730H1047" class="line"/><text x="738" y="720" class="msg">finalize views on completion</text>
</svg>
