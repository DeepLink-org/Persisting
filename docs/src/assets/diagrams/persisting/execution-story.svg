<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">The Persisting execution story</title>
  <desc id="desc">A goal becomes one isolated Agent Run in pVisor. Its effects are reviewed and selectively accepted. The same Run model scales through pPilot, while pChronicle preserves canonical events, lineage, and evidence.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#17233a"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12324a"/>
      <stop offset="1" stop-color="#0c3939"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.48"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#7dd3fc"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-size: 17px; fill: #94a3b8; }
      .step { font-size: 13px; font-weight: 700; letter-spacing: 1.3px; fill: #7dd3fc; }
      .heading { font-size: 23px; font-weight: 700; fill: #f8fafc; }
      .label { font-size: 16px; font-weight: 650; fill: #e2e8f0; }
      .body { font-size: 14px; fill: #cbd5e1; }
      .tiny { font-size: 12px; fill: #94a3b8; }
      .card { fill: #111c2e; stroke: #334155; stroke-width: 1.5; }
      .line { fill: none; stroke: #7dd3fc; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="760" rx="28" fill="url(#background)"/>
  <text x="52" y="58" class="title">One execution model, from laptop to fleet</text>
  <text x="52" y="88" class="subtitle">Run one Agent · govern its effects · orchestrate many · preserve the history</text>

  <path d="M338 327H385M665 327H712M992 327H1039" class="line"/>

  <g filter="url(#shadow)">
    <rect x="58" y="142" width="280" height="370" rx="24" fill="url(#visor)" stroke="#5eead4" stroke-width="2"/>
    <text x="86" y="181" class="step">01 · EXECUTE</text>
    <text x="86" y="220" class="heading">One Agent Run</text>
    <text x="86" y="250" class="body">pVisor creates an isolated</text>
    <text x="86" y="273" class="body">virtual execution environment.</text>

    <rect x="86" y="306" width="224" height="132" rx="16" fill="#0b1728" stroke="#2b5260"/>
    <text x="108" y="338" class="label">Agent environment</text>
    <text x="108" y="368" class="tiny">identity · workspace · authority</text>
    <text x="108" y="392" class="tiny">state · tools · network</text>
    <text x="108" y="416" class="tiny">checkpoint · evidence</text>

    <text x="86" y="478" class="tiny">Host · Container · MicroVM · Fleet</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="385" y="142" width="280" height="370" rx="24" class="card" stroke="#fbbf24" stroke-width="2"/>
    <text x="413" y="181" class="step" fill="#fbbf24">02 · DECIDE</text>
    <text x="413" y="220" class="heading">Govern effects</text>
    <text x="413" y="250" class="body">Execution does not automatically</text>
    <text x="413" y="273" class="body">commit changes to the real world.</text>

    <rect x="413" y="306" width="224" height="132" rx="16" fill="#0b1728" stroke="#5b4b25"/>
    <text x="435" y="338" class="label">Review the consequence</text>
    <text x="435" y="368" class="tiny">inspect · select · apply</text>
    <text x="435" y="392" class="tiny">promote · compensate · drop</text>
    <text x="435" y="416" class="tiny">record the decision</text>

    <text x="413" y="478" class="tiny">Repeatable, selective Effect promotion</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="712" y="142" width="280" height="370" rx="24" class="card" stroke="#c084fc" stroke-width="2"/>
    <text x="740" y="181" class="step" fill="#c084fc">03 · SCALE</text>
    <text x="740" y="220" class="heading">Orchestrate many</text>
    <text x="740" y="250" class="body">pPilot schedules independent Runs</text>
    <text x="740" y="273" class="body">without changing their semantics.</text>

    <rect x="740" y="306" width="224" height="132" rx="16" fill="#0b1728" stroke="#4d3763"/>
    <text x="762" y="338" class="label">Run pool</text>
    <text x="762" y="368" class="tiny">bounded concurrency · leases</text>
    <text x="762" y="392" class="tiny">retry · recovery · fencing</text>
    <text x="762" y="416" class="tiny">durable result ownership</text>

    <text x="740" y="478" class="tiny">The Run stays stable across placement</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1039" y="142" width="303" height="370" rx="24" class="card" stroke="#86efac" stroke-width="2"/>
    <text x="1067" y="181" class="step" fill="#86efac">04 · REMEMBER</text>
    <text x="1067" y="220" class="heading">Preserve history</text>
    <text x="1067" y="250" class="body">pChronicle keeps the facts needed</text>
    <text x="1067" y="273" class="body">after processes and Attempts end.</text>

    <rect x="1067" y="306" width="247" height="132" rx="16" fill="#0b1728" stroke="#315944"/>
    <text x="1089" y="338" class="label">Canonical Run history</text>
    <text x="1089" y="368" class="tiny">events · effects · artifacts</text>
    <text x="1089" y="392" class="tiny">lineage · evidence · revisions</text>
    <text x="1089" y="416" class="tiny">query · replay · evaluate</text>

    <text x="1067" y="478" class="tiny">History is separate from execution truth</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="145" y="574" width="1110" height="110" rx="22" fill="#101c30" stroke="#60a5fa" stroke-width="1.7"/>
    <text x="183" y="614" class="label">The stable contract</text>
    <text x="183" y="648" class="body">Run identity · delegated authority · semantic checkpoint · Effect frontier · lineage · evidence</text>
    <text x="183" y="671" class="tiny">Physical process, kernel, node, and provider may change without redefining the logical Run.</text>
  </g>
</svg>
