<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Persisting execution and history field</title>
  <desc id="desc">A dark cyberpunk network representing a governed Agent Run, durable state, and queryable history.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101d"/><stop offset="1" stop-color="#102b37"/></linearGradient>
    <radialGradient id="core"><stop stop-color="#5eead4" stop-opacity=".38"/><stop offset=".45" stop-color="#22d3ee" stop-opacity=".1"/><stop offset="1" stop-color="#0b1322" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#5eead4" stroke-opacity=".09"/></pattern>
  </defs>
  <rect width="1200" height="760" rx="36" fill="url(#bg)"/>
  <rect x="34" y="34" width="1132" height="692" rx="28" fill="url(#grid)"/>
  <circle cx="600" cy="380" r="330" fill="url(#core)"/>
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M70 170H250L330 250H470" stroke="#2dd4bf" stroke-width="3"/>
    <path d="M1130 170H950L870 250H730" stroke="#60a5fa" stroke-width="3"/>
    <path d="M70 590H240L330 500H470" stroke="#2dd4bf" stroke-width="2"/>
    <path d="M1130 590H960L870 500H730" stroke="#60a5fa" stroke-width="2"/>
    <path d="M600 78V205M600 555V682" stroke="#a78bfa" stroke-width="2" stroke-dasharray="8 16"/>
    <path d="M330 380H485M715 380H870" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 12"/>
  </g>
  <g fill="#07101d" stroke-width="3" filter="url(#glow)">
    <circle cx="250" cy="170" r="13" stroke="#2dd4bf"/><circle cx="950" cy="170" r="13" stroke="#60a5fa"/>
    <circle cx="240" cy="590" r="11" stroke="#2dd4bf"/><circle cx="960" cy="590" r="11" stroke="#60a5fa"/>
    <circle cx="600" cy="205" r="10" stroke="#a78bfa"/><circle cx="600" cy="555" r="10" stroke="#a78bfa"/>
  </g>
  <g transform="translate(600 380)">
    <circle r="142" fill="#0a1725" stroke="#2dd4bf" stroke-width="3"/>
    <circle r="116" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="3 10"/>
    <path d="M-64 0H64M0-64V64" stroke="#5eead4" stroke-opacity=".45"/>
    <path d="M-38-38L38 38M38-38L-38 38" stroke="#60a5fa" stroke-opacity=".42"/>
    <circle r="28" fill="#5eead4" fill-opacity=".18" stroke="#a7f3d0" stroke-width="2"/>
    <circle r="8" fill="#ccfbf1"/>
  </g>
  <g fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="3">
    <text x="92" y="145">CONTROLLED RUN</text><text x="880" y="145">DURABLE HISTORY</text>
    <text x="76" y="650">EFFECTS / EVIDENCE</text><text x="906" y="650">SOURCE / QUERY</text>
  </g>
  <g fill="#5eead4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2">
    <text x="92" y="198">STAGE · REVIEW · APPLY</text><text x="880" y="198">SNAPSHOT · PROJECT · EXPORT</text>
  </g>
</svg>
