<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
  <title id="title">pVisor libkrun execution path</title>
  <desc id="desc">The host Run controller prepares an OCI or explicit root filesystem and a separate workspace, passes a RunnerSpec to the self-executed pVisor runner and libkrun, then mounts the merged root through virtio-fs into a minimal Linux guest that runs the Agent.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#17233a"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:32px;font-weight:700;fill:#f8fafc}.sub{font-size:16px;fill:#94a3b8}.zone{font-size:13px;font-weight:750;letter-spacing:1.2px;fill:#5eead4}.label{font-size:17px;font-weight:700;fill:#f8fafc}.tiny{font-size:12px;fill:#94a3b8}.box{fill:#101c2f;stroke:#3b4b63;stroke-width:1.5}.accent{fill:#10333a;stroke:#5eead4;stroke-width:1.8}.line{fill:none;stroke:#7dd3fc;stroke-width:2.2;marker-end:url(#a)}</style></defs>
  <rect width="1400" height="680" rx="26" fill="url(#bg)"/><text x="48" y="54" class="title">pVisor libkrun execution path</text><text x="48" y="82" class="sub">The VM replaces the executor; pVisor retains Run ownership and finalization</text>
  <rect x="42" y="116" width="820" height="500" rx="24" fill="#0b1728" stroke="#334155"/><text x="72" y="151" class="zone">HOST PVISOR</text>
  <rect x="78" y="186" width="210" height="90" rx="16" class="accent"/><text x="108" y="224" class="label">Run controller</text><text x="108" y="249" class="tiny">RunId · AttemptId · lease</text>
  <rect x="340" y="178" width="220" height="105" rx="16" class="box"/><text x="370" y="218" class="label">OCI registry/cache</text><text x="370" y="244" class="tiny">verified image layers</text><text x="370" y="264" class="tiny">or explicit rootfs</text>
  <rect x="608" y="178" width="220" height="105" rx="16" class="box"/><text x="638" y="218" class="label">Rootfs OverlayFS</text><text x="638" y="244" class="tiny">immutable lower</text><text x="638" y="264" class="tiny">per-Run temporary upper</text>
  <rect x="340" y="354" width="220" height="94" rx="16" class="box"/><text x="370" y="393" class="label">Host workspace</text><text x="370" y="419" class="tiny">separate durable mount</text>
  <rect x="608" y="344" width="220" height="114" rx="16" class="accent"/><text x="638" y="384" class="label">VmExecutor</text><text x="638" y="410" class="tiny">RunnerSpec + GuestSpec</text><text x="638" y="432" class="tiny">CPU · RAM · cwd · env</text>
  <rect x="340" y="500" width="488" height="78" rx="16" class="box"/><text x="370" y="534" class="label">self-exec pVisor runner</text><text x="370" y="558" class="tiny">Linux confinement or macOS HVF · watchdog · cancellation</text>
  <path d="M288 231H340" class="line"/><path d="M560 231H608" class="line"/><path d="M718 283V344" class="line"/><path d="M560 401H608" class="line"/><path d="M718 458V500" class="line"/>
  <rect x="910" y="116" width="448" height="208" rx="24" fill="#10283a" stroke="#60a5fa"/><text x="940" y="151" class="zone" fill="#7dd3fc">LIBKRUN VMM</text>
  <rect x="948" y="181" width="174" height="94" rx="16" class="box"/><text x="986" y="219" class="label">libkrun</text><text x="978" y="245" class="tiny">vCPU · RAM · init</text>
  <rect x="1150" y="181" width="170" height="94" rx="16" class="box"/><text x="1193" y="219" class="label">virtio-fs</text><text x="1178" y="245" class="tiny">guest root + workspace</text>
  <path d="M828 539H880V228H948" class="line"/><path d="M1122 228H1150" class="line"/>
  <rect x="910" y="368" width="448" height="248" rx="24" fill="#10261f" stroke="#86efac"/><text x="940" y="403" class="zone" fill="#86efac">MINIMAL LINUX GUEST</text>
  <rect x="958" y="444" width="164" height="98" rx="16" class="box"/><text x="993" y="483" class="label">embedded init</text><text x="986" y="509" class="tiny">mount · env · exec</text>
  <rect x="1150" y="444" width="160" height="98" rx="16" class="accent"/><text x="1188" y="483" class="label">Agent</text><text x="1178" y="509" class="tiny">guest process tree</text>
  <path d="M1235 275V420H1040V444" class="line"/><path d="M1122 493H1150" class="line"/><path d="M1230 542V592H858V573" class="line"/><text x="918" y="586" class="tiny">exit · cancel · watchdog → Run controller</text>
</svg>
