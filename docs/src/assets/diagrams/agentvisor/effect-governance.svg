<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">The AgentVisor effect governance loop</title>
  <desc id="desc">An Agent action moves through intent, admission, execution, observation, containment, and a decision to promote, reject, or compensate. Evidence closes the loop. Reversible, transactional, compensatable, and irreversible effects require different controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#17233a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7dd3fc"/>
    </marker>
    <marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5eead4"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-size: 17px; font-weight: 400; fill: #94a3b8; }
      .label { font-size: 19px; font-weight: 700; fill: #f8fafc; }
      .small { font-size: 14px; font-weight: 500; fill: #cbd5e1; }
      .tiny { font-size: 12px; font-weight: 500; fill: #94a3b8; }
      .card { fill: #111c2e; stroke: #334155; stroke-width: 1.5; }
      .line { fill: none; stroke: #7dd3fc; stroke-width: 2.4; marker-end: url(#arrow); }
      .teal-line { fill: none; stroke: #5eead4; stroke-width: 2.4; marker-end: url(#teal-arrow); }
    </style>
  </defs>

  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <text x="52" y="55" class="title">The effect governance loop</text>
  <text x="52" y="84" class="subtitle">Autonomy is useful only when consequences have identity, state, policy, and evidence</text>

  <path d="M205 268H327" class="line"/>
  <path d="M493 268H615" class="line"/>
  <path d="M781 268H903" class="line"/>
  <path d="M1069 268H1191" class="line"/>

  <g filter="url(#shadow)">
    <rect x="45" y="207" width="160" height="122" rx="19" class="card" stroke="#60a5fa"/>
    <circle cx="78" cy="241" r="13" fill="#1d4ed8"/>
    <text x="104" y="248" class="label">Intent</text>
    <text x="70" y="280" class="small">Agent proposes</text>
    <text x="70" y="303" class="small">an action</text>

    <polygon points="410,192 493,268 410,344 327,268" fill="#18233a" stroke="#c084fc" stroke-width="2"/>
    <text x="367" y="260" class="label">Admit</text>
    <text x="367" y="285" class="tiny">authority + context</text>

    <rect x="615" y="207" width="166" height="122" rx="19" class="card" stroke="#38bdf8"/>
    <text x="652" y="248" class="label">Execute</text>
    <text x="642" y="280" class="small">allow · deny</text>
    <text x="642" y="303" class="small">or transform</text>

    <rect x="903" y="207" width="166" height="122" rx="19" class="card" stroke="#fbbf24"/>
    <text x="938" y="248" class="label">Observe</text>
    <text x="930" y="280" class="small">capture actual</text>
    <text x="930" y="303" class="small">outcome</text>

    <rect x="1191" y="207" width="166" height="122" rx="19" fill="#102b31" stroke="#5eead4" stroke-width="2"/>
    <text x="1224" y="248" class="label">Contain</text>
    <text x="1218" y="280" class="small">isolate or hold</text>
    <text x="1218" y="303" class="small">when possible</text>
  </g>

  <path d="M1274 329V392" class="teal-line"/>
  <g filter="url(#shadow)">
    <rect x="1038" y="405" width="319" height="135" rx="21" fill="#10281e" stroke="#86efac" stroke-width="2"/>
    <text x="1072" y="444" class="label">Resolve the consequence</text>
    <text x="1072" y="477" class="small">promote · reject · expire</text>
    <text x="1072" y="501" class="small">rollback · compensate · escalate</text>
    <text x="1072" y="523" class="tiny">The decision depends on reversibility</text>
  </g>

  <path d="M1038 472H900" class="teal-line"/>
  <g filter="url(#shadow)">
    <rect x="610" y="405" width="290" height="135" rx="21" class="card" stroke="#fb7185"/>
    <text x="645" y="444" class="label">Evidence + accountability</text>
    <text x="645" y="477" class="small">intent · decision · mechanism</text>
    <text x="645" y="501" class="small">outcome · lineage · terminal state</text>
    <text x="645" y="523" class="tiny">Durable facts close the loop</text>
  </g>

  <path d="M610 472C462 472 402 424 402 357" fill="none" stroke="#fb7185" stroke-width="2.2" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="426" y="451" class="tiny" fill="#fda4af">future admission learns from evidence</text>

  <text x="52" y="605" class="label">Different effects require different controls</text>
  <g filter="url(#shadow)">
    <rect x="52" y="631" width="304" height="82" rx="17" class="card" stroke="#86efac"/>
    <text x="80" y="664" class="label">Reversible</text>
    <text x="80" y="690" class="small">stage · review · promote · discard</text>

    <rect x="382" y="631" width="304" height="82" rx="17" class="card" stroke="#60a5fa"/>
    <text x="410" y="664" class="label">Transactional</text>
    <text x="410" y="690" class="small">reserve · validate · commit atomically</text>

    <rect x="712" y="631" width="304" height="82" rx="17" class="card" stroke="#fbbf24"/>
    <text x="740" y="664" class="label">Compensatable</text>
    <text x="740" y="690" class="small">commit + durable counter-action</text>

    <rect x="1042" y="631" width="306" height="82" rx="17" fill="#2a1421" stroke="#fb7185" stroke-width="1.5"/>
    <text x="1070" y="664" class="label">Irreversible</text>
    <text x="1070" y="690" class="small">strong admission · minimal authority</text>
  </g>

  <text x="52" y="739" class="tiny">Observation proves that something happened. It does not, by itself, make the consequence controllable or reversible.</text>
</svg>
