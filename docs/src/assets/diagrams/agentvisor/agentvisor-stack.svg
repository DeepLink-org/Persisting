<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">The AgentVisor category in the Agent infrastructure stack</title>
  <desc id="desc">Multiple Agents share a pool of compute, filesystem, network, model, tool, and credential resources through an AgentVisor. Each Agent Run receives an isolated virtual execution environment with its own identity, state, authority, effects, and failure boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#17233a"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13253d"/>
      <stop offset="1" stop-color="#0d3438"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7dd3fc"/>
    </marker>
    <marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5eead4"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-size: 17px; font-weight: 400; fill: #94a3b8; }
      .label { font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .small { font-size: 14px; font-weight: 500; fill: #cbd5e1; }
      .tiny { font-size: 12px; font-weight: 500; fill: #94a3b8; }
      .card { fill: #111c2e; stroke: #334155; stroke-width: 1.5; }
      .inner { fill: #0c1829; stroke: #2b5260; stroke-width: 1.5; }
      .line { fill: none; stroke: #7dd3fc; stroke-width: 2.4; marker-end: url(#arrow); }
      .teal-line { fill: none; stroke: #5eead4; stroke-width: 2.4; marker-end: url(#teal-arrow); }
    </style>
  </defs>

  <rect width="1400" height="820" rx="28" fill="url(#bg)"/>
  <text x="52" y="55" class="title">The AgentVisor category</text>
  <text x="52" y="84" class="subtitle">The hypervisor for Agent execution</text>

  <g filter="url(#shadow)">
    <rect x="380" y="112" width="640" height="94" rx="20" class="card" stroke="#60a5fa" stroke-width="2"/>
    <text x="428" y="151" class="label">Independent Agent Runs</text>
    <text x="428" y="179" class="small">Agent A · Agent B · Agent C · different frameworks and goals</text>
  </g>
  <path d="M700 206V245" class="line"/>
    <text x="719" y="231" class="tiny">request an Agent virtual execution environment</text>

  <g filter="url(#shadow)">
    <rect x="250" y="248" width="900" height="326" rx="27" fill="url(#visor)" stroke="#5eead4" stroke-width="2.5"/>
    <text x="291" y="291" class="label" fill="#5eead4">AgentVisor</text>
    <text x="418" y="291" class="small">maps shared resources into isolated Agent virtual execution environments</text>

    <rect x="291" y="319" width="248" height="96" rx="16" class="inner"/>
    <circle cx="322" cy="348" r="8" fill="#60a5fa"/>
    <text x="343" y="355" class="label">Agent environment A</text>
    <text x="312" y="385" class="small">identity · workspace · authority</text>
    <text x="312" y="405" class="tiny">Isolated state and effect boundary</text>

    <rect x="576" y="319" width="248" height="96" rx="16" class="inner"/>
    <circle cx="607" cy="348" r="8" fill="#c084fc"/>
    <text x="628" y="355" class="label">Agent environment B</text>
    <text x="597" y="385" class="small">identity · workspace · authority</text>
    <text x="597" y="405" class="tiny">Isolated state and effect boundary</text>

    <rect x="861" y="319" width="248" height="96" rx="16" class="inner"/>
    <circle cx="892" cy="348" r="8" fill="#fbbf24"/>
    <text x="913" y="355" class="label">Agent environment C</text>
    <text x="882" y="385" class="small">identity · workspace · authority</text>
    <text x="882" y="405" class="tiny">Isolated state and effect boundary</text>

    <rect x="291" y="442" width="248" height="96" rx="16" class="inner"/>
    <circle cx="322" cy="471" r="8" fill="#86efac"/>
    <text x="343" y="478" class="label">Resource multiplexing</text>
    <text x="312" y="508" class="small">compute · storage · network</text>
    <text x="312" y="528" class="tiny">Shared pool, bounded consumption</text>

    <rect x="576" y="442" width="248" height="96" rx="16" class="inner"/>
    <circle cx="607" cy="471" r="8" fill="#38bdf8"/>
    <text x="628" y="478" class="label">Lifecycle + placement</text>
    <text x="597" y="508" class="small">create · place · suspend · migrate</text>
    <text x="597" y="528" class="tiny">Stable Run across physical substrates</text>

    <rect x="861" y="442" width="248" height="96" rx="16" class="inner"/>
    <circle cx="892" cy="471" r="8" fill="#fb7185"/>
    <text x="913" y="478" class="label">Continuity + evidence</text>
    <text x="882" y="508" class="small">checkpoint · lineage · outcomes</text>
    <text x="882" y="528" class="tiny">State and accountability follow the Run</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="35" y="326" width="180" height="160" rx="20" class="card" stroke="#c084fc"/>
    <text x="64" y="365" class="label">Identity</text>
    <text x="64" y="391" class="small">human · workload</text>
    <text x="64" y="414" class="small">organization</text>
    <text x="64" y="446" class="label">Policy</text>
    <text x="64" y="471" class="tiny">intent and constraints</text>
  </g>
  <path d="M215 406H250" class="line"/>

  <g filter="url(#shadow)">
    <rect x="1185" y="326" width="180" height="160" rx="20" class="card" stroke="#86efac"/>
    <text x="1214" y="365" class="label">Evidence</text>
    <text x="1214" y="391" class="small">audit · lineage</text>
    <text x="1214" y="414" class="small">attestation</text>
    <text x="1214" y="446" class="label">History</text>
    <text x="1214" y="471" class="tiny">durable accountable facts</text>
  </g>
  <path d="M1150 406H1185" class="teal-line"/>

  <path d="M700 574V612" class="teal-line"/>
  <text x="720" y="599" class="tiny">capability-aware Attempt placement</text>

  <g filter="url(#shadow)">
    <rect x="250" y="629" width="164" height="77" rx="16" class="card"/>
    <text x="285" y="663" class="label">Host sandbox</text>
    <text x="285" y="687" class="tiny">local process boundary</text>

    <rect x="434" y="629" width="164" height="77" rx="16" class="card"/>
    <text x="478" y="663" class="label">Container</text>
    <text x="470" y="687" class="tiny">shared-kernel isolation</text>

    <rect x="618" y="629" width="164" height="77" rx="16" class="card"/>
    <text x="660" y="663" class="label">MicroVM</text>
    <text x="649" y="687" class="tiny">dedicated guest kernel</text>

    <rect x="802" y="629" width="164" height="77" rx="16" class="card"/>
    <text x="828" y="663" class="label">Confidential</text>
    <text x="837" y="687" class="tiny">attested environment</text>

    <rect x="986" y="629" width="164" height="77" rx="16" class="card"/>
    <text x="1035" y="663" class="label">Fleet</text>
    <text x="1012" y="687" class="tiny">scheduled remote provider</text>
  </g>

  <path d="M700 706V738" class="line"/>
  <g filter="url(#shadow)">
    <rect x="270" y="746" width="860" height="48" rx="15" fill="#10281e" stroke="#86efac" stroke-width="1.5"/>
    <text x="331" y="777" class="small">Models · tools · files · data · networks · services · people · physical systems</text>
  </g>
  <text x="52" y="812" class="tiny">Multiple Agents share the infrastructure pool while identity, state, authority, effects, and failures remain isolated.</text>
</svg>
