<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">AgentVisor effect promotion flow</title>
  <desc id="desc">An Agent action passes capability policy. Denied actions stop. Allowed actions occur inside a Run and become observed or staged effects. Filesystem effects can be reviewed, selectively applied multiple times, fully applied, or dropped. General external effect promotion remains a product gate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#17233a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#86efac"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-size: 17px; font-weight: 400; fill: #94a3b8; }
      .label { font-size: 19px; font-weight: 700; fill: #f8fafc; }
      .small { font-size: 14px; font-weight: 500; fill: #cbd5e1; }
      .tiny { font-size: 12px; font-weight: 500; fill: #94a3b8; }
      .card { fill: #111c2e; stroke: #334155; stroke-width: 1.5; }
      .line { fill: none; stroke: #7dd3fc; stroke-width: 2.5; marker-end: url(#arrow); }
      .green-line { fill: none; stroke: #86efac; stroke-width: 2.5; marker-end: url(#green-arrow); }
      .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="720" rx="28" fill="url(#bg)"/>
  <text x="52" y="55" class="title">Effect promotion is separate from execution permission</text>
  <text x="52" y="84" class="subtitle">The Agent can work freely inside a Run without every result becoming real</text>

  <g filter="url(#shadow)">
    <rect x="55" y="180" width="190" height="92" rx="18" class="card" stroke="#60a5fa"/>
    <text x="92" y="220" class="label">Agent action</text>
    <text x="92" y="246" class="small">file · network · tool</text>
  </g>
  <path d="M245 226H318" class="line"/>

  <g filter="url(#shadow)">
    <polygon points="430,148 542,226 430,304 318,226" fill="#132238" stroke="#c084fc" stroke-width="2"/>
    <text x="372" y="216" class="label">Capability</text>
    <text x="391" y="241" class="small">decision</text>
  </g>

  <path d="M430 304V369" fill="none" stroke="#fb7185" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="448" y="342" class="small" fill="#fda4af">denied</text>
  <g filter="url(#shadow)">
    <rect x="330" y="382" width="200" height="86" rx="18" fill="#2a1421" stroke="#fb7185" stroke-width="1.5"/>
    <text x="382" y="419" class="label">Stopped</text>
    <text x="361" y="445" class="small">No effect is admitted</text>
  </g>

  <path d="M542 226H620" class="line"/>
  <text x="560" y="207" class="small" fill="#86efac">allowed</text>
  <g filter="url(#shadow)">
    <rect x="620" y="140" width="310" height="172" rx="22" fill="#102b31" stroke="#5eead4" stroke-width="2"/>
    <text x="653" y="181" class="label" fill="#5eead4">Inside the isolated Run</text>
    <rect x="653" y="204" width="112" height="68" rx="13" class="card"/>
    <text x="676" y="234" class="small">Observed</text>
    <text x="673" y="255" class="tiny">audit fact</text>
    <rect x="786" y="204" width="112" height="68" rx="13" class="card"/>
    <text x="813" y="234" class="small">Staged</text>
    <text x="808" y="255" class="tiny">pending effect</text>
  </g>

  <path d="M842 312V364" class="line"/>
  <g filter="url(#shadow)">
    <rect x="706" y="378" width="272" height="105" rx="19" class="card" stroke="#fbbf24"/>
    <text x="759" y="416" class="label">Review or policy</text>
    <text x="743" y="443" class="small">classify · select · dependency close</text>
    <text x="768" y="464" class="tiny">No implicit promotion</text>
  </g>

  <path d="M978 430H1045" class="green-line"/>
  <g filter="url(#shadow)">
    <rect x="1045" y="366" width="295" height="129" rx="20" fill="#10281e" stroke="#86efac" stroke-width="2"/>
    <text x="1096" y="405" class="label">Selective promotion</text>
    <text x="1083" y="433" class="small">apply path/glob batch · repeat</text>
    <text x="1096" y="456" class="small">apply all remaining · or drop</text>
    <text x="1115" y="478" class="tiny">Recorded in apply-ledger.json</text>
  </g>

  <path d="M1192 495V553" class="green-line"/>
  <g filter="url(#shadow)">
    <rect x="1064" y="566" width="256" height="82" rx="18" fill="#0f2b20" stroke="#86efac" stroke-width="1.5"/>
    <text x="1110" y="601" class="label">Real environment</text>
    <text x="1110" y="626" class="small">Only promoted results enter</text>
  </g>

  <path d="M1045 452C1002 521 955 538 894 510C838 485 783 509 783 558C783 595 816 608 857 608" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="819" y="548" class="tiny" fill="#fde68a">remaining stage stays reviewable</text>

  <path d="M765 238C713 286 661 331 619 390C573 455 569 536 644 580" class="dash"/>
  <g filter="url(#shadow)">
    <rect x="520" y="579" width="438" height="83" rx="18" class="card" stroke-dasharray="8 7"/>
    <text x="554" y="612" class="label">General external Effect Broker</text>
    <text x="554" y="638" class="small">durable identity · prepare/commit · compensation</text>
    <text x="846" y="612" class="tiny" fill="#fbbf24">PRODUCT GATE</text>
  </g>

  <text x="52" y="689" class="tiny">Current first-class promotion: filesystem effects. Observation alone does not make an irreversible external mutation rollback-safe.</text>
</svg>
