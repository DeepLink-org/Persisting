<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">pVisor local-to-cluster continuity</title>
  <desc id="desc">A personal machine and a future cluster share the same AgentVisor contracts: RunSpec, Agent ABI, capability evidence, checkpoints and lineage, effect promotion, and Run Bundle. Local pVisor uses host, container, or VM providers. The cluster target adds a durable pPilot controller and pVisor node fleet while retaining pChronicle history.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#17233a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5eead4"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-size: 17px; font-weight: 400; fill: #94a3b8; }
      .label { font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .small { font-size: 14px; font-weight: 500; fill: #cbd5e1; }
      .tiny { font-size: 12px; font-weight: 500; fill: #94a3b8; }
      .card { fill: #111c2e; stroke: #334155; stroke-width: 1.5; }
      .line { fill: none; stroke: #7dd3fc; stroke-width: 2.5; marker-end: url(#arrow); }
      .teal-line { fill: none; stroke: #5eead4; stroke-width: 2.5; marker-end: url(#teal-arrow); }
    </style>
  </defs>

  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <text x="52" y="55" class="title">Local-to-cluster means semantic continuity</text>
  <text x="52" y="84" class="subtitle">Keep the Agent contract; replace execution placement and control ownership</text>

  <g filter="url(#shadow)">
    <rect x="52" y="129" width="398" height="474" rx="25" fill="#101d31" stroke="#60a5fa" stroke-width="2"/>
    <text x="84" y="171" class="label">Personal machine</text>
    <text x="330" y="171" class="tiny" fill="#86efac">CURRENT</text>

    <rect x="87" y="202" width="328" height="69" rx="15" class="card"/>
    <text x="118" y="232" class="label">User or Agent CLI</text>
    <text x="118" y="254" class="tiny">Direct foreground; no daemon required</text>

    <path d="M251 271V305" class="line"/>
    <rect x="87" y="318" width="328" height="108" rx="17" fill="#102b31" stroke="#5eead4" stroke-width="2"/>
    <text x="118" y="351" class="label">Local pVisor</text>
    <text x="118" y="378" class="small">Run · capability · effect · checkpoint</text>
    <text x="118" y="402" class="tiny">Auto-approve can still stage results</text>

    <path d="M251 426V458" class="teal-line"/>
    <rect x="87" y="471" width="96" height="75" rx="14" class="card"/>
    <text x="111" y="503" class="small">Host</text>
    <text x="105" y="526" class="tiny">safe path</text>
    <rect x="203" y="471" width="96" height="75" rx="14" class="card"/>
    <text x="216" y="503" class="small">Container</text>
    <text x="223" y="526" class="tiny">OCI path</text>
    <rect x="319" y="471" width="96" height="75" rx="14" class="card"/>
    <text x="338" y="503" class="small">libkrun</text>
    <text x="347" y="526" class="tiny">KVM/HVF</text>

    <text x="87" y="578" class="tiny">Workspace stage and Run state remain owner-local.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="505" y="113" width="390" height="506" rx="25" fill="#14233a" stroke="#c084fc" stroke-width="2"/>
    <text x="548" y="156" class="label">Portable AgentVisor contract</text>
    <text x="548" y="181" class="small">The stable layer — not a VM image</text>

    <rect x="548" y="211" width="304" height="54" rx="13" class="card"/>
    <circle cx="574" cy="238" r="7" fill="#60a5fa"/>
    <text x="594" y="244" class="small">RunSpec + Run / Attempt identity</text>

    <rect x="548" y="279" width="304" height="54" rx="13" class="card"/>
    <circle cx="574" cy="306" r="7" fill="#5eead4"/>
    <text x="594" y="312" class="small">Authenticated Agent ABI</text>

    <rect x="548" y="347" width="304" height="54" rx="13" class="card"/>
    <circle cx="574" cy="374" r="7" fill="#c084fc"/>
    <text x="594" y="380" class="small">Per-dimension enforcement evidence</text>

    <rect x="548" y="415" width="304" height="54" rx="13" class="card"/>
    <circle cx="574" cy="442" r="7" fill="#fbbf24"/>
    <text x="594" y="448" class="small">Effect staging and promotion</text>

    <rect x="548" y="483" width="304" height="54" rx="13" class="card"/>
    <circle cx="574" cy="510" r="7" fill="#86efac"/>
    <text x="594" y="516" class="small">Checkpoint + fork + lineage</text>

    <rect x="548" y="551" width="304" height="54" rx="13" class="card"/>
    <circle cx="574" cy="578" r="7" fill="#fb7185"/>
    <text x="594" y="584" class="small">Run Bundle + pChronicle events</text>
  </g>

  <path d="M450 366H505" class="line"/>
  <path d="M895 366H950" class="line"/>

  <g filter="url(#shadow)">
    <rect x="950" y="129" width="398" height="474" rx="25" fill="#101d31" stroke="#fbbf24" stroke-width="2" stroke-dasharray="9 7"/>
    <text x="982" y="171" class="label">Cluster product</text>
    <text x="1218" y="171" class="tiny" fill="#fbbf24">PRODUCT GATE</text>

    <rect x="985" y="202" width="328" height="82" rx="15" class="card"/>
    <text x="1016" y="234" class="label">Durable pPilot controller</text>
    <text x="1016" y="260" class="tiny">placement · fenced lease · reconciliation</text>

    <path d="M1149 284V318" class="line"/>
    <rect x="985" y="331" width="328" height="116" rx="17" fill="#102b31" stroke="#5eead4" stroke-width="2"/>
    <text x="1016" y="364" class="label">pVisor node fleet</text>
    <text x="1016" y="391" class="small">node registration · heartbeat · trust domain</text>
    <text x="1016" y="416" class="tiny">Same Run and effect semantics on every node</text>

    <path d="M1149 447V478" class="teal-line"/>
    <rect x="985" y="491" width="99" height="64" rx="13" class="card"/>
    <text x="1004" y="520" class="small">Provider A</text>
    <text x="1011" y="541" class="tiny">microVM</text>
    <rect x="1099" y="491" width="99" height="64" rx="13" class="card"/>
    <text x="1118" y="520" class="small">Provider B</text>
    <text x="1123" y="541" class="tiny">container</text>
    <rect x="1213" y="491" width="99" height="64" rx="13" class="card"/>
    <text x="1232" y="520" class="small">Provider C</text>
    <text x="1238" y="541" class="tiny">remote</text>

    <text x="985" y="579" class="tiny">Needs qualified real-backend recovery tests.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="215" y="650" width="970" height="70" rx="18" fill="#10281e" stroke="#86efac" stroke-width="1.5"/>
    <text x="266" y="682" class="label">Canonical history and portable artifacts</text>
    <text x="266" y="705" class="small">pChronicle · content digests · Run Bundle · checkpoints · effect ledger</text>
    <text x="1018" y="692" class="tiny">local or object store</text>
  </g>
  <path d="M251 603V650" class="teal-line"/>
  <path d="M700 619V650" class="teal-line"/>
  <path d="M1149 603V650" class="teal-line"/>

  <text x="52" y="744" class="tiny">Initial portability is semantic and artifact-based. It does not claim transparent process-memory or live-VM migration.</text>
</svg>
