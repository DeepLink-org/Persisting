<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">pVisor AgentVisor architecture</title>
  <desc id="desc">An Agent sends one Run contract into pVisor. pVisor governs lifecycle, capabilities, effects, checkpoints, lineage, evidence, and runtime drivers. pPilot orchestrates many Runs, pChronicle stores canonical history, and host, container, VM, and future fleet providers execute Attempts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#17233a"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12243b"/>
      <stop offset="1" stop-color="#0f2f38"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5eead4"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-size: 17px; font-weight: 400; fill: #94a3b8; }
      .label { font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .small { font-size: 14px; font-weight: 500; fill: #cbd5e1; }
      .tiny { font-size: 12px; font-weight: 500; fill: #94a3b8; }
      .accent { fill: #5eead4; }
      .card { fill: #111c2e; stroke: #334155; stroke-width: 1.5; }
      .inner { fill: #0d1728; stroke: #2b5260; stroke-width: 1.5; }
      .line { fill: none; stroke: #7dd3fc; stroke-width: 2.5; marker-end: url(#arrow); }
      .teal-line { fill: none; stroke: #5eead4; stroke-width: 2.5; marker-end: url(#arrow-teal); }
    </style>
  </defs>

  <rect width="1400" height="780" rx="28" fill="url(#bg)"/>
  <text x="52" y="55" class="title">pVisor is an AgentVisor</text>
  <text x="52" y="84" class="subtitle">One governed Agent Run across local and clustered execution providers</text>

  <g filter="url(#shadow)">
    <rect x="535" y="110" width="330" height="86" rx="18" class="card" stroke="#60a5fa"/>
    <circle cx="581" cy="153" r="20" fill="#1d4ed8" opacity="0.9"/>
    <path d="M573 153h16M581 145v16" stroke="#dbeafe" stroke-width="3" stroke-linecap="round"/>
    <text x="617" y="147" class="label">Autonomous Agent</text>
    <text x="617" y="171" class="small">CLI · coding Agent · evaluation worker</text>
  </g>
  <path d="M700 196V235" class="line"/>
  <text x="718" y="220" class="tiny">RunSpec + capability intent</text>

  <g filter="url(#shadow)">
    <rect x="278" y="238" width="844" height="354" rx="26" fill="url(#visor)" stroke="#5eead4" stroke-width="2.5"/>
    <text x="315" y="280" class="label accent">pVisor</text>
    <text x="383" y="280" class="small">AgentVisor control and containment layer</text>

    <rect x="315" y="307" width="238" height="105" rx="16" class="inner"/>
    <circle cx="345" cy="337" r="9" fill="#60a5fa"/>
    <text x="365" y="344" class="label">Lifecycle</text>
    <text x="336" y="374" class="small">Run · Attempt · cancel · terminal</text>
    <text x="336" y="396" class="tiny">Stable identity above process</text>

    <rect x="581" y="307" width="238" height="105" rx="16" class="inner"/>
    <circle cx="611" cy="337" r="9" fill="#c084fc"/>
    <text x="631" y="344" class="label">Capabilities</text>
    <text x="602" y="374" class="small">read · write · network · tools</text>
    <text x="602" y="396" class="tiny">Evidence per requested dimension</text>

    <rect x="847" y="307" width="238" height="105" rx="16" class="inner"/>
    <circle cx="877" cy="337" r="9" fill="#fbbf24"/>
    <text x="897" y="344" class="label">Effects</text>
    <text x="868" y="374" class="small">observe · stage · apply · drop</text>
    <text x="868" y="396" class="tiny">Control what becomes real</text>

    <rect x="315" y="438" width="238" height="105" rx="16" class="inner"/>
    <circle cx="345" cy="468" r="9" fill="#86efac"/>
    <text x="365" y="475" class="label">Checkpoint</text>
    <text x="336" y="505" class="small">quiesce · snapshot · fork · lineage</text>
    <text x="336" y="527" class="tiny">Logical Agent + workspace state</text>

    <rect x="581" y="438" width="238" height="105" rx="16" class="inner"/>
    <circle cx="611" cy="468" r="9" fill="#fb7185"/>
    <text x="631" y="475" class="label">Evidence</text>
    <text x="602" y="505" class="small">Run Bundle · events · metrics</text>
    <text x="602" y="527" class="tiny">What ran, changed, and enforced</text>

    <rect x="847" y="438" width="238" height="105" rx="16" class="inner"/>
    <circle cx="877" cy="468" r="9" fill="#38bdf8"/>
    <text x="897" y="475" class="label">Drivers</text>
    <text x="868" y="505" class="small">AgentCtl · Gateway · Overlay*</text>
    <text x="868" y="527" class="tiny">One policy context per Attempt</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="35" y="322" width="205" height="132" rx="20" class="card" stroke="#c084fc"/>
    <text x="70" y="360" class="label">pPilot</text>
    <text x="70" y="387" class="small">plan · lease · schedule</text>
    <text x="70" y="410" class="small">retry · reconcile</text>
    <text x="70" y="434" class="tiny">Many Runs</text>
  </g>
  <path d="M240 388H278" class="line"/>

  <g filter="url(#shadow)">
    <rect x="1160" y="322" width="205" height="132" rx="20" class="card" stroke="#86efac"/>
    <text x="1191" y="360" class="label">pChronicle</text>
    <text x="1191" y="387" class="small">canonical events</text>
    <text x="1191" y="410" class="small">history · lineage</text>
    <text x="1191" y="434" class="tiny">Durable facts</text>
  </g>
  <path d="M1122 388H1160" class="teal-line"/>

  <path d="M700 592V625" class="teal-line"/>
  <text x="718" y="616" class="tiny">Attempt placement</text>

  <g filter="url(#shadow)">
    <rect x="278" y="642" width="190" height="82" rx="17" class="card"/>
    <text x="318" y="678" class="label">Safe host</text>
    <text x="318" y="702" class="tiny">Linux · macOS</text>

    <rect x="496" y="642" width="190" height="82" rx="17" class="card"/>
    <text x="533" y="678" class="label">Container</text>
    <text x="533" y="702" class="tiny">Docker · Podman</text>

    <rect x="714" y="642" width="190" height="82" rx="17" class="card"/>
    <text x="754" y="678" class="label">libkrun VM</text>
    <text x="754" y="702" class="tiny">KVM · HVF</text>

    <rect x="932" y="642" width="190" height="82" rx="17" class="card" stroke-dasharray="7 6"/>
    <text x="968" y="678" class="label">Fleet provider</text>
    <text x="968" y="702" class="tiny">Product gate</text>
  </g>

  <text x="52" y="752" class="tiny">AgentVisor defines Agent semantics; execution providers define process, container, VM, and node mechanics.</text>
</svg>
