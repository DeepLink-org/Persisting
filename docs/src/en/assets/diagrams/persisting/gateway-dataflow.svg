<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="520" viewBox="0 0 1300 520" role="img" aria-labelledby="title desc">
  <title id="title">Gateway event dataflow</title><desc id="desc">The HTTP capture proxy emits events to a non-blocking event flow. The flow appends canonical events to Lance and independently triggers handlers. Handlers reduce events into Storyline and write AgenticMD, ATIF, and other derived formats. Lance can replay events through the same handlers.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#17233a"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker><marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c084fc"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:32px;font-weight:700;fill:#f8fafc}.sub{font-size:16px;fill:#94a3b8}.label{font-size:18px;font-weight:700;fill:#f8fafc}.tiny{font-size:12px;fill:#94a3b8}.box{fill:#111c2e;stroke:#40516a;stroke-width:1.5}.accent{fill:#10333a;stroke:#5eead4;stroke-width:1.8}.truth{fill:#10261f;stroke:#86efac;stroke-width:1.8}.line{fill:none;stroke:#7dd3fc;stroke-width:2.2;marker-end:url(#a)}.replay{fill:none;stroke:#c084fc;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#d)}</style></defs>
  <rect width="1300" height="520" rx="26" fill="url(#bg)"/><text x="48" y="55" class="title">Gateway dataflow</text><text x="48" y="84" class="sub">Record canonical events first; build human and exchange views through independent handlers</text>
  <rect x="52" y="181" width="190" height="110" rx="18" class="box"/><text x="82" y="222" class="label">Capture proxy</text><text x="82" y="249" class="tiny">HTTP · SSE · protocol adapter</text><text x="82" y="272" class="tiny">forward without waiting on views</text>
  <path d="M242 236H312" class="line"/><text x="259" y="220" class="tiny">emit</text>
  <rect x="315" y="181" width="190" height="110" rx="18" class="accent"/><text x="345" y="222" class="label">Event flow</text><text x="345" y="249" class="tiny">ordered append · bounded fan-out</text><text x="345" y="272" class="tiny">callback never blocks</text>
  <path d="M410 291V368H540" class="line"/><text x="428" y="346" class="tiny">record</text>
  <rect x="543" y="341" width="205" height="105" rx="18" class="truth"/><text x="573" y="383" class="label">events.lance</text><text x="573" y="410" class="tiny">canonical source of truth</text><text x="573" y="433" class="tiny">append + replay</text>
  <path d="M505 236H580" class="line"/><text x="523" y="220" class="tiny">trigger</text>
  <rect x="583" y="181" width="190" height="110" rx="18" class="box"/><text x="613" y="222" class="label">Handlers</text><text x="613" y="249" class="tiny">interpret · reduce · retry</text><text x="613" y="272" class="tiny">failure does not block HTTP</text>
  <path d="M773 236H843" class="line"/>
  <rect x="846" y="181" width="190" height="110" rx="18" class="box"/><text x="876" y="222" class="label">Storyline hub</text><text x="876" y="249" class="tiny">session + call normalization</text><text x="876" y="272" class="tiny">human-readable semantics</text>
  <path d="M1036 236H1106" class="line"/>
  <rect x="1109" y="181" width="150" height="110" rx="18" class="box"/><text x="1139" y="222" class="label">Views</text><text x="1139" y="249" class="tiny">AgenticMD</text><text x="1139" y="272" class="tiny">ATIF · others</text>
  <path d="M645 341V316H678V291" class="replay"/><text x="686" y="327" class="tiny" fill="#c084fc">replay</text>
</svg>
