<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">The AgentVisor execution continuum</title>
  <desc id="desc">A stable Agent Run identity, delegated authority, semantic checkpoint, effect frontier, lineage, and evidence can continue from a personal device through a team environment to a secure fleet, while the physical execution substrate and operational controls change.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#17233a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5eead4"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-size: 17px; font-weight: 400; fill: #94a3b8; }
      .label { font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .small { font-size: 14px; font-weight: 500; fill: #cbd5e1; }
      .tiny { font-size: 12px; font-weight: 500; fill: #94a3b8; }
      .card { fill: #111c2e; stroke: #334155; stroke-width: 1.5; }
      .line { fill: none; stroke: #5eead4; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <text x="52" y="55" class="title">One Agent Run across an execution continuum</text>
  <text x="52" y="84" class="subtitle">Semantic portability preserves authority and accountability while infrastructure changes</text>

  <g filter="url(#shadow)">
    <rect x="82" y="123" width="1236" height="124" rx="22" fill="#14233a" stroke="#c084fc" stroke-width="2"/>
    <text x="119" y="161" class="label">What remains stable</text>
    <rect x="119" y="183" width="171" height="40" rx="12" class="card"/>
    <text x="145" y="209" class="small">Run identity + intent</text>
    <rect x="309" y="183" width="171" height="40" rx="12" class="card"/>
    <text x="334" y="209" class="small">Delegated authority</text>
    <rect x="499" y="183" width="171" height="40" rx="12" class="card"/>
    <text x="519" y="209" class="small">Semantic checkpoint</text>
    <rect x="689" y="183" width="171" height="40" rx="12" class="card"/>
    <text x="718" y="209" class="small">Effect frontier</text>
    <rect x="879" y="183" width="171" height="40" rx="12" class="card"/>
    <text x="924" y="209" class="small">Lineage</text>
    <rect x="1069" y="183" width="212" height="40" rx="12" class="card"/>
    <text x="1100" y="209" class="small">Enforcement + outcome evidence</text>
  </g>

  <path d="M249 405H512" class="line"/>
  <path d="M700 405H963" class="line"/>
  <text x="341" y="387" class="tiny">promote artifacts and checkpoints</text>
  <text x="788" y="387" class="tiny">schedule with stronger guarantees</text>

  <g filter="url(#shadow)">
    <rect x="52" y="292" width="394" height="290" rx="24" fill="#101d31" stroke="#60a5fa" stroke-width="2"/>
    <text x="85" y="334" class="label">Personal device</text>
    <text x="85" y="361" class="small">Low friction · same-owner trust</text>
    <rect x="85" y="390" width="328" height="74" rx="15" fill="#102b31" stroke="#5eead4" stroke-width="1.5"/>
    <text x="116" y="421" class="label">Local AgentVisor</text>
    <text x="116" y="446" class="tiny">Autonomy inside; controlled promotion outside</text>
    <rect x="85" y="486" width="100" height="60" rx="13" class="card"/>
    <text x="112" y="514" class="small">Process</text>
    <text x="108" y="535" class="tiny">sandbox</text>
    <rect x="199" y="486" width="100" height="60" rx="13" class="card"/>
    <text x="220" y="514" class="small">Container</text>
    <text x="225" y="535" class="tiny">local OCI</text>
    <rect x="313" y="486" width="100" height="60" rx="13" class="card"/>
    <text x="339" y="514" class="small">MicroVM</text>
    <text x="343" y="535" class="tiny">local VM</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="503" y="292" width="394" height="290" rx="24" fill="#101d31" stroke="#c084fc" stroke-width="2"/>
    <text x="536" y="334" class="label">Team environment</text>
    <text x="536" y="361" class="small">Shared policy · review · artifacts</text>
    <rect x="536" y="390" width="328" height="74" rx="15" fill="#102b31" stroke="#5eead4" stroke-width="1.5"/>
    <text x="567" y="421" class="label">Organizational AgentVisor</text>
    <text x="567" y="446" class="tiny">Identity, budgets, promotion, and common evidence</text>
    <rect x="536" y="486" width="145" height="60" rx="13" class="card"/>
    <text x="570" y="514" class="small">Workstation</text>
    <text x="568" y="535" class="tiny">managed local</text>
    <rect x="719" y="486" width="145" height="60" rx="13" class="card"/>
    <text x="754" y="514" class="small">Team pool</text>
    <text x="755" y="535" class="tiny">shared compute</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="954" y="292" width="394" height="290" rx="24" fill="#101d31" stroke="#fbbf24" stroke-width="2"/>
    <text x="987" y="334" class="label">Secure fleet</text>
    <text x="987" y="361" class="small">Multi-tenant · attested · reconciled</text>
    <rect x="987" y="390" width="328" height="74" rx="15" fill="#102b31" stroke="#5eead4" stroke-width="1.5"/>
    <text x="1018" y="421" class="label">Fleet AgentVisor</text>
    <text x="1018" y="446" class="tiny">Fenced ownership, placement, and node evidence</text>
    <rect x="987" y="486" width="100" height="60" rx="13" class="card"/>
    <text x="1010" y="514" class="small">MicroVM</text>
    <text x="1014" y="535" class="tiny">tenant pool</text>
    <rect x="1101" y="486" width="100" height="60" rx="13" class="card"/>
    <text x="1118" y="514" class="small">Confidential</text>
    <text x="1123" y="535" class="tiny">attested</text>
    <rect x="1215" y="486" width="100" height="60" rx="13" class="card"/>
    <text x="1244" y="514" class="small">Remote</text>
    <text x="1239" y="535" class="tiny">specialized</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="188" y="630" width="1024" height="76" rx="18" fill="#10281e" stroke="#86efac" stroke-width="1.5"/>
    <text x="236" y="662" class="label">Portable artifacts and accountable history</text>
    <text x="236" y="688" class="small">content digests · checkpoints · effect records · evidence bundles · causal lineage</text>
  </g>
  <path d="M249 582V630" class="line"/>
  <path d="M700 582V630" class="line"/>
  <path d="M1151 582V630" class="line"/>

  <text x="52" y="739" class="tiny">Local-to-fleet is semantic continuity first. Live process-memory or VM migration is an optional provider capability, not the category definition.</text>
</svg>
