<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
  <title id="title">pChronicle Snapshot query path</title><desc id="desc">CLI or server configuration produces Dataset mounts and an immutable Snapshot. The table provider first evaluates source predicates, skips unmatched sources, lazily resolves matched sources once, and constructs an empty, direct, or union execution plan.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#17233a"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:32px;font-weight:700;fill:#f8fafc}.sub{font-size:16px;fill:#94a3b8}.label{font-size:16px;font-weight:700;fill:#f8fafc}.tiny{font-size:12px;fill:#94a3b8}.box{fill:#111c2e;stroke:#40516a;stroke-width:1.5}.accent{fill:#10333a;stroke:#5eead4;stroke-width:1.8}.skip{fill:#291925;stroke:#fb7185;stroke-width:1.6}.line{fill:none;stroke:#7dd3fc;stroke-width:2.1;marker-end:url(#a)}</style></defs>
  <rect width="1400" height="600" rx="26" fill="url(#bg)"/><text x="48" y="55" class="title">Snapshot: prune first, resolve lazily</text><text x="48" y="84" class="sub">A Snapshot fixes membership and source versions; physical data opens only when selected</text>
  <rect x="55" y="155" width="190" height="92" rx="16" class="box"/><text x="85" y="193" class="label">CLI / Server config</text><text x="85" y="218" class="tiny">names · roots · format hints</text><path d="M245 201H292" class="line"/>
  <rect x="295" y="155" width="190" height="92" rx="16" class="box"/><text x="325" y="193" class="label">DatasetMount[]</text><text x="325" y="218" class="tiny">normalized mount identity</text><path d="M485 201H532" class="line"/>
  <rect x="535" y="145" width="230" height="112" rx="17" class="accent"/><text x="565" y="185" class="label">Catalog snapshot</text><text x="565" y="211" class="tiny">immutable membership</text><text x="565" y="233" class="tiny">fixed source version descriptors</text><path d="M765 201H812" class="line"/>
  <rect x="815" y="145" width="220" height="112" rx="17" class="box"/><text x="845" y="185" class="label">Dataset schema</text><text x="845" y="211" class="tiny">sources + stable tables</text><text x="845" y="233" class="tiny">registered in DataFusion</text><path d="M1035 201H1082" class="line"/>
  <rect x="1085" y="145" width="260" height="112" rx="17" class="accent"/><text x="1115" y="185" class="label">CatalogTableProvider</text><text x="1115" y="211" class="tiny">evaluate Dataset + _file_ predicate</text><text x="1115" y="233" class="tiny">before constructing physical scans</text>
  <path d="M1215 257V324H1035" class="line"/><text x="1060" y="306" class="tiny">matched</text>
  <rect x="805" y="327" width="230" height="98" rx="17" class="box"/><text x="835" y="366" class="label">LazySource.resolve</text><text x="835" y="392" class="tiny">OnceCell single-flight</text><text x="835" y="413" class="tiny">cache result or error</text>
  <path d="M805 376H742" class="line"/>
  <rect x="495" y="327" width="244" height="98" rx="17" class="box"/><text x="525" y="366" class="label">Native source provider</text><text x="525" y="392" class="tiny">Storyline · events · file</text><text x="525" y="413" class="tiny">projection + filter + limit</text>
  <path d="M495 376H432" class="line"/>
  <rect x="165" y="327" width="264" height="98" rx="17" class="accent"/><text x="195" y="366" class="label">Physical execution plan</text><text x="195" y="392" class="tiny">0 EmptyExec · 1 direct plan</text><text x="195" y="413" class="tiny">N sources → UnionExec</text>
  <path d="M1215 257V496H1085" class="line"/><text x="1103" y="478" class="tiny">unmatched</text>
  <rect x="825" y="453" width="260" height="92" rx="17" class="skip"/><text x="855" y="492" class="label">Skip the source</text><text x="855" y="518" class="tiny">no parse · no remote open · no scan</text>
</svg>
