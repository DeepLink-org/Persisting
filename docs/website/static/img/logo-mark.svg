<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Persisting</title>
  <desc id="desc">A persistent core held by two continuous data paths</desc>
  <defs>
    <linearGradient id="persisting-orbit" x1="8" y1="52" x2="57" y2="10" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67e8f9"/>
      <stop offset=".52" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>
    <linearGradient id="persisting-core" x1="22" y1="47" x2="43" y2="17" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0e7490"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="persisting-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="16" fill="#0b1230" stroke="#243b72" stroke-width="2"/>
  <path d="M14 42c-4.2-10.8 1.3-22.8 12.1-27 10.8-4.2 22.8 1.3 27 12.1 4.2 10.8-1.3 22.8-12.1 27-10.8 4.2-22.8-1.3-27-12.1Z" fill="none" stroke="url(#persisting-orbit)" stroke-width="3.2" stroke-linecap="round" opacity=".9" filter="url(#persisting-glow)"/>
  <path d="M50 22c4.2 10.8-1.3 22.8-12.1 27-10.8 4.2-22.8-1.3-27-12.1-4.2-10.8 1.3-22.8 12.1-27 10.8-4.2 22.8 1.3 27 12.1Z" fill="none" stroke="#67e8f9" stroke-width="1.2" stroke-linecap="round" opacity=".45"/>
  <path d="m32 18 12 7v14l-12 7-12-7V25l12-7Z" fill="url(#persisting-core)" stroke="#d9faff" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M32 23v18M24 28l16 9M40 28l-16 9" fill="none" stroke="#e0f2fe" stroke-width="1.2" opacity=".88"/>
  <circle cx="32" cy="32" r="3" fill="#fff7ed" filter="url(#persisting-glow)"/>
</svg>
