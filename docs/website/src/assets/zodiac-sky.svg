<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Zodiac constellations over a night horizon</title>
<desc id="desc">A view from Earth across a deep blue night sky, with the twelve zodiac constellations drawn as connected stars along the ecliptic.</desc>
<style> .constellation{opacity:0;animation:seasonal-constellation 144s linear infinite}.constellation:nth-child(1){animation-delay:-0s}.constellation:nth-child(2){animation-delay:-12s}.constellation:nth-child(3){animation-delay:-24s}.constellation:nth-child(4){animation-delay:-36s}.constellation:nth-child(5){animation-delay:-48s}.constellation:nth-child(6){animation-delay:-60s}.constellation:nth-child(7){animation-delay:-72s}.constellation:nth-child(8){animation-delay:-84s}.constellation:nth-child(9){animation-delay:-96s}.constellation:nth-child(10){animation-delay:-108s}.constellation:nth-child(11){animation-delay:-120s}.constellation:nth-child(12){animation-delay:-132s}@keyframes seasonal-constellation{0%,2%{opacity:0}4%,10%{opacity:1}12%,100%{opacity:0}} .myth-outline{fill:none;stroke:#a9c5f4;stroke-opacity:.28;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:4 4}.constellation-lines{fill:none;stroke:#b9d5ff;stroke-opacity:.7;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}.constellation-stars{fill:#e6f0ff;fill-opacity:.95}.constellation-label{fill:#b9d5ff;fill-opacity:.55;font:10px ui-sans-serif,system-ui,sans-serif;letter-spacing:1.5px;text-transform:uppercase}.ecliptic{fill:none}</style><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#07133b"/><stop offset=".66" stop-color="#0b1d4b"/><stop offset="1" stop-color="#142653"/></linearGradient><radialGradient id="glow" cx="50%" cy="20%" r="70%"><stop stop-color="#667eea" stop-opacity=".12"/><stop offset="1" stop-color="#0a1539" stop-opacity="0"/></radialGradient></defs>
<rect width="1600" height="900" fill="url(#sky)"/><rect width="1600" height="900" fill="url(#glow)"/>
