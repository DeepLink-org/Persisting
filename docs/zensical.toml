[project]
site_name = "Persisting"
site_description = "Persistent Infrastructure for the Agent Era"
site_url = "https://deeplink-org.github.io/Persisting/"
docs_dir = "src"
site_dir = "site"
exclude_docs = ["installation.md", "stylesheets/reference-home.css"]
repo_name = "DeepLink-org/Persisting"
repo_url = "https://github.com/DeepLink-org/Persisting"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "en/index.md" },
  { "Get started" = [
    "en/overview.md",
    { "Installation" = "en/installation.md" },
    { "Recording and Analyzing Agent Trajectories" = "en/pchronicle/get-started.md" },
  ] },
  { "pChronicle" = ["en/pchronicle/index.md", "en/pchronicle/get-started.md", { "Concepts" = ["en/pchronicle/concepts/index.md", "en/pchronicle/concepts/dataset-and-source.md", "en/pchronicle/concepts/facts-and-projections.md"] }, { "Guides" = ["en/pchronicle/guides/index.md", "en/pchronicle/guides/discover-and-query.md", "en/pchronicle/guides/exchange.md", "en/pchronicle/guides/serve.md", "en/pchronicle/guides/ui.md", "en/pchronicle/guides/troubleshooting.md"] }, { "Design" = ["en/pchronicle/design/index.md", "en/pchronicle/design/architecture.md", "en/pchronicle/design/catalog.md", "en/pchronicle/design/trajectory-storage.md", "en/pchronicle/design/storyline-lance.md"] }, { "Reference" = ["en/pchronicle/reference/index.md", "en/pchronicle/reference/cli.md", "en/pchronicle/reference/query-model.md", "en/pchronicle/reference/terminology.md", "en/pchronicle/reference/agenticmd.md", "en/pchronicle/reference/formats/index.md", "en/pchronicle/reference/cases-self.md", "en/pchronicle/reference/cases-platform.md"] }] },
  { "Agent Infra Thinkings" = ["en/why-persisting.md", "en/roadmap.md", "en/guides/using-persisting.md", "en/system-design/index.md", "en/system-design/design-principles.md", "en/system-design/architecture.md", "en/project/index.md", "en/project/examples.md", "en/project/engineering.md", "en/project/releasing.md", { "RFCs" = ["en/rfcs/index.md", "en/rfcs/0001-storyline-format.md", "en/rfcs/0003-pchronicle-ownership.md", "en/rfcs/0004-actf-format.md", "en/rfcs/0006-pchronicle-vortex-backend.md", "en/rfcs/0008-atif-format.md", "en/rfcs/0009-openai-messages-format.md", "en/rfcs/0010-agent-corpus-lance-layout.md", "en/rfcs/0012-pchronicle-find-query-syntax.md", "en/rfcs/0013-pchronicle-warehouse-catalog.md", "en/rfcs/0014-compact-jsonl.md", "en/rfcs/0015-chronicle-manifest.md"] }] },
]

[project.theme]
language = "en"
custom_dir = "overrides"
logo = "assets/persisting-icon.png"
favicon = "assets/persisting-icon.png"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.expand",
  "navigation.indexes",
  "navigation.path",
  "navigation.tracking",
  "navigation.top",
  "search.highlight",
  "content.code.copy",
  "content.code.select",
  "content.code.annotate",
  "content.tabs.link",
  "content.tooltips",
  "content.footnote.tooltips",
  "toc.follow",
]

[project.theme.palette]
scheme = "slate"
primary = "custom"
accent = "custom"


[project.extra]
homepage = "en/"
alternate = [
  { name = "English", link = "/Persisting/en/", lang = "en" },
  { name = "中文", link = "/Persisting/zh/", lang = "zh" },
]

[project.markdown_extensions]
admonition = {}
"pymdownx.details" = {}
"pymdownx.superfences" = {}
"pymdownx.highlight" = { anchor_linenums = true }
"pymdownx.inlinehilite" = {}
"pymdownx.tabbed" = { alternate_style = true }
attr_list = {}
md_in_html = {}
def_list = {}
tables = {}
toc.permalink = true
