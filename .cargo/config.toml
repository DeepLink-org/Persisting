# `persisting-core` uses PyO3's abi3-py310 feature. Cargo does not read
# `.python-version`, so asking PyO3 to probe PATH makes otherwise identical
# builds fail whenever `/usr/bin/python3` (Python 3.9 on older macOS) wins.
# ABI3 builds on Unix do not need interpreter-specific configuration; keeping
# discovery disabled makes plain Cargo builds deterministic and portable.
# Maturin still selects the Python environment where the built extension is
# installed.
[env]
PYO3_NO_PYTHON = "1"

# `maturin develop` requires a recognizable virtual environment. Use either:
#    - 在仓库根创建并激活：python -m venv .venv && source .venv/bin/activate
#      （Windows：.venv\Scripts\activate），再 pip install maturin && maturin develop --release
#    - 或已 conda activate / 其它 venv 且设置了 CONDA_PREFIX / VIRTUAL_ENV
#    不想用 venv 时：maturin build --release，再 pip install target/wheels/*.whl

[build]
incremental = true
