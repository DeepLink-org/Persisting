[toolchain]
# Stable is the default compiler for local development and normal CI builds.
# The opt-in `just build-analysis` and `just sanitize` recipes install/use
# nightly explicitly because they depend on unstable Cargo/rustc flags.
channel = "stable"
# rust-src is used by the opt-in `just sanitize` recipe (`-Z build-std`).
components = ["rustfmt", "clippy", "rust-src"]
